class="card"

>

🧩 نقشه برش ورق
</h2>

<script>
const parts = [];
const KERF = 0.3;
const addPartButton =
document.getElementById("addPart");
const partsTable =
document.getElementById("partsTable");
const message =
document.getElementById("message");
function showMessage(text,error=false){
    message.innerText=text;
    message.style.display="block";
    if(error){
        message.style.background="#fef3f2";
        message.style.color="#b42318";
    }else{
        message.style.background="#ecfdf3";
        message.style.color="#067647";
    }
    setTimeout(function(){
        message.style.display="none";
    },2500);
}
function escapeHTML(text){
    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function renderParts(){
    partsTable.innerHTML="";
    if(parts.length===0){
        partsTable.innerHTML=`
        <tr>
        <td
        colspan="6"
        class="empty"
        >
        هنوز قطعه‌ای اضافه نشده است.
        </td>
        </tr>
        `;
        return;
    }
    parts.forEach(function(part,index){
        const row=
        document.createElement("tr");
        row.innerHTML=`
        <td>
        ${escapeHTML(part.name)}
        </td>
        <td>
        ${part.length}
        </td>
        <td>
        ${part.width}
        </td>
        <td>
        ${part.qty}
        </td>
        <td>
        آماده
        </td>
        <td>
        <button
        class="btn-danger"
        type="button"
        onclick="deletePart(${index})"
        >
        حذف
        </button>
        </td>
        `;
        partsTable.appendChild(row);
    });
}
addPartButton.addEventListener(
"click",
function(){
    const name=
    document
    .getElementById("partName")
    .value
    .trim();
    const length=
    Number(
    document.getElementById("partLength").value
    );
    const width=
    Number(
    document.getElementById("partWidth").value
    );
    const qty=
    Number(
    document.getElementById("partQty").value
    );
    if(!name){
        showMessage(
        "نام قطعه را وارد کنید.",
        true
        );
        return;
    }
    if(length<=0){
        showMessage(
        "طول قطعه معتبر نیست.",
        true
        );
        return;
    }
    if(width<=0){
        showMessage(
        "عرض قطعه معتبر نیست.",
        true
        );
        return;
    }
    if(
    qty<=0 ||
    !Number.isInteger(qty)
    ){
        showMessage(
        "تعداد قطعه معتبر نیست.",
        true
        );
        return;
    }
    parts.push({
        name:name,
        length:length,
        width:width,
        qty:qty
    });
    renderParts();
    showMessage(
    "قطعه با موفقیت اضافه شد."
    );
    document.getElementById(
    "partName"
    ).value="";
    document.getElementById(
    "partLength"
    ).value="";
    document.getElementById(
    "partWidth"
    ).value="";
    document.getElementById(
    "partQty"
    ).value=1;
    document.getElementById(
    "partName"
    ).focus();
});
function deletePart(index){
    parts.splice(index,1);
    renderParts();
}
document
.getElementById("clearParts")
.addEventListener(
"click",
function(){
    parts.length=0;
    renderParts();
    document.getElementById(
    "summaryCard"
    ).style.display="none";
    document.getElementById(
    "layoutCard"
    ).style.display="none";
    showMessage(
    "تمام قطعات پاک شدند."
    );
});
/*
=================================================
موتور چیدمان
=================================================
*/
function expandParts(){
    const result=[];
    parts.forEach(function(part){
        for(
        let i=0;
        i<part.qty;
        i++
        ){
            result.push({
                name:part.name,
                originalLength:part.length,
                originalWidth:part.width,
                length:part.length,
                width:part.width,
                rotated:false
            });
        }
    });
    return result;
}
/*
بررسی می‌کند آیا قطعه
در یک مستطیل مشخص جا می‌شود یا نه
*/
function fits(part,x,y,w,h){
    return (
        x + w <= h.sheetWidth + 0.0001 &&
        y + h <= h.sheetLength + 0.0001
    );
}
/*
الگوریتم ساده و سریع Shelf Packing
*/
function createSheet(sheetWidth,sheetLength){
    return {
        sheetWidth:sheetWidth,
        sheetLength:sheetLength,
        pieces:[],
        shelves:[]
    };
}
function tryPlaceOnSheet(sheet,part){
    /*
    ابتدا بین ردیف‌های موجود
    دنبال فضای مناسب می‌گردیم
    */
    for(
    let i=0;
    i<sheet.shelves.length;
    i++
    ){
        const shelf=
        sheet.shelves[i];
        /*
        حالت عادی
        */
        if(
        part.width <= shelf.height &&
        shelf.x + part.length <= sheet.sheetWidth
        ){
            part.x=shelf.x;
            part.y=shelf.y;
            part.placedLength=part.length;
            part.placedWidth=part.width;
            shelf.x +=
            part.length + KERF;
            sheet.pieces.push(part);
            return true;
        }
        /*
        حالت چرخیده
        */
        if(
        part.length <= shelf.height &&
        shelf.x + part.width <= sheet.sheetWidth
        ){
            part.x=shelf.x;
            part.y=shelf.y;
            part.placedLength=part.width;
            part.placedWidth=part.length;
            part.rotated=true;
            shelf.x +=
            part.width + KERF;
            sheet.pieces.push(part);
            return true;
        }
    }
    /*
    ساخت ردیف جدید
    */
    let y=0;
    if(sheet.shelves.length){
        const last=
        sheet.shelves[
        sheet.shelves.length-1
        ];
        y=
        last.y +
        last.height +
        KERF;
    }
    /*
    حالت عادی
    */
    if(
    y + part.width <= sheet.sheetLength &&
    part.length <= sheet.sheetWidth
    ){
        const shelf={
            x:part.length + KERF,
            y:y,
            height:part.width
        };
        part.x=0;
        part.y=y;
        part.placedLength=part.length;
        part.placedWidth=part.width;
        part.rotated=false;
        sheet.shelves.push(shelf);
        sheet.pieces.push(part);
        return true;
    }
    /*
    حالت چرخیده
    */
    if(
    y + part.length <= sheet.sheetLength &&
    part.width <= sheet.sheetWidth
    ){
        const shelf={
            x:part.width + KERF,
            y:y,
            height:part.length
        };
        part.x=0;
        part.y=y;
        part.placedLength=part.width;
        part.placedWidth=part.length;
        part.rotated=true;
        sheet.shelves.push(shelf);
        sheet.pieces.push(part);
        return true;
    }
    return false;
}
function packParts(sheetWidth,sheetLength){
    const pieces=
    expandParts();
    /*
    قطعات بزرگ‌تر ابتدا
    */
    pieces.sort(function(a,b){
        return (
            b.length*b.width
            -
            a.length*a.width
        );
    });
    const sheets=[];
    pieces.forEach(function(piece){
        let placed=false;
        /*
        تلاش برای قرار دادن
        روی ورق‌های موجود
        */
        for(
        let i=0;
        i<sheets.length;
        i++
        ){
            if(
            tryPlaceOnSheet(
            sheets[i],
            piece
            )
            ){
                placed=true;
                break;
            }
        }
        /*
        اگر جا نشد
        ورق جدید
        */
        if(!placed){
            const newSheet=
            createSheet(
            sheetWidth,
            sheetLength
            );
            if(
            !tryPlaceOnSheet(
            newSheet,
            piece
            )
            ){
                piece.unplaceable=true;
            }
            sheets.push(newSheet);
        }
    });
    return sheets;
}
/*
=================================================
نمایش ورق
=================================================
*/
function drawSheet(canvas,sheet){
    const ctx=
    canvas.getContext("2d");
    const maxWidth=900;
    const scale=
    Math.min(
        maxWidth / sheet.sheetWidth,
        650 / sheet.sheetLength
    );
    canvas.width=
    Math.max(
        300,
        Math.round(sheet.sheetWidth*scale)
    );
    canvas.height=
    Math.max(
        220,
        Math.round(sheet.sheetLength*scale)
    );
    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
    );
    /*
    پس‌زمینه ورق
    */
    ctx.fillStyle="#f7e7bd";
    ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
    );
    ctx.strokeStyle="#8b7355";
    ctx.lineWidth=3;
    ctx.strokeRect(
    0,
    0,
    canvas.width,
    canvas.height
    );
    /*
    قطعات
    */
    sheet.pieces.forEach(
    function(piece,index){
        const x=
        piece.x*scale;
        const y=
        piece.y*scale;
        const w=
        piece.placedLength*scale;
        const h=
        piece.placedWidth*scale;
        /*
        رنگ قطعه
        */
        const colors=[
            "#dbeafe",
            "#dcfce7",
            "#fef3c7",
            "#fce7f3",
            "#ede9fe",
            "#cffafe",
            "#ffedd5"
        ];
        ctx.fillStyle=
        colors[index % colors.length];
        ctx.fillRect(
        x,
        y,
        w,
        h
        );
        ctx.strokeStyle="#334155";
        ctx.lineWidth=1;
        ctx.strokeRect(
        x,
        y,
        w,
        h
        );
        /*
        متن قطعه
        */
        ctx.fillStyle="#111827";
        const fontSize=
        Math.max(
            10,
            Math.min(
                18,
                12*scale
            )
        );
        ctx.font=
        fontSize+"px Tahoma";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        const centerX=
        x+w/2;
        const centerY=
        y+h/2;
        /*
        نام قطعه
        */
        ctx.fillText(
        piece.name,
        centerX,
        centerY-8
        );
        /*
        ابعاد
        */
        ctx.font=
        Math.max(
            8,
            fontSize-2
        )+"px Tahoma";
        ctx.fillText(
        piece.placedLength+
        " × "+
        piece.placedWidth,
        centerX,
        centerY+9
        );
        /*
        شماره قطعه
        */
        ctx.textAlign="right";
        ctx.textBaseline="top";
        ctx.fillText(
        "#"+(index+1),
        x+4,
        y+4
        );
    });
    /*
    ابعاد ورق
    */
    ctx.fillStyle="#111827";
    ctx.font="bold 14px Tahoma";
    ctx.textAlign="center";
    ctx.textBaseline="bottom";
    ctx.fillText(
    sheet.sheetWidth+
    " × "+
    sheet.sheetLength+
    " cm",
    canvas.width/2,
    canvas.height-5
    );
}
function calculateSheetArea(sheet){
    return (
        sheet.sheetWidth *
        sheet.sheetLength
    );
}
function calculateUsedArea(sheet){
    let area=0;
    sheet.pieces.forEach(
    function(piece){
        area +=
        piece.placedLength *
        piece.placedWidth;
    });
    return area;
}
function renderLayouts(
sheets,
sheetWidth,
sheetLength
){
    const container=
    document.getElementById(
    "layoutResults"
    );
    container.innerHTML="";
    sheets.forEach(
    function(sheet,index){
        const area=
        calculateSheetArea(sheet);
        const used=
        calculateUsedArea(sheet);
        const waste=
        Math.max(
        0,
        100 -
        (used/area*100)
        );
        const section=
        document.createElement("div");
        section.className=
        "sheet-result";
        section.innerHTML=`
        <div class="sheet-title">
        📄 ورق شماره ${index+1}
        </div>
        <div class="sheet-info">
        ابعاد ورق:
        <b>
        ${sheetWidth} × ${sheetLength}
        </b>
        سانتی‌متر
        <br>
        تعداد قطعات:
        <b>
        ${sheet.pieces.length}
        </b>
        <br>
        استفاده از سطح ورق:
        <b>
        ${(100-waste).toFixed(1)}%
        </b>
        <br>
        پرت تئوری:
        <b>
        ${waste.toFixed(1)}%
        </b>
        </div>
        <div class="canvas-wrapper">
        <canvas
        class="sheet-canvas"
        id="sheetCanvas${index}"
        ></canvas>
        </div>
        <div class="legend">
        📏 فاصله تیغ:
        ۳ میلی‌متر
        <br>
        🔄 قطعاتی که چرخیده‌اند با علامت
        «چرخش» در ادامه نمایش داده می‌شوند.
        </div>
        `;
        container.appendChild(section);
        const canvas=
        document.getElementById(
        "sheetCanvas"+index
        );
        drawSheet(
        canvas,
        sheet
        );
    });
}
/*
=================================================
محاسبه نهایی
=================================================
*/
document
.getElementById("calculate")
.addEventListener(
"click",
function(){
    if(parts.length===0){
        showMessage(
        "ابتدا حداقل یک قطعه اضافه کنید.",
        true
        );
        return;
    }
    const sheetSize=
    document
    .getElementById("sheetSize")
    .value
    .split("x");
    const sheetWidth=
    Number(sheetSize[0]);
    const sheetLength=
    Number(sheetSize[1]);
    const totalPieces=
    parts.reduce(
    function(sum,part){
        return sum+part.qty;
    },
    0
    );
    const totalArea=
    parts.reduce(
    function(sum,part){
        return sum+
        (
            part.length*
            part.width*
            part.qty
        );
    },
    0
    );
    const sheets=
    packParts(
    sheetWidth,
    sheetLength
    );
    const totalSheetArea=
    sheets.length*
    sheetWidth*
    sheetLength;
    const efficiency=
    (
        totalArea/
        totalSheetArea*
        100
    ).toFixed(1);
    document.getElementById(
    "summary"
    ).innerHTML=`
    <b>📦 اطلاعات ورق</b>
    <br>
    جنس:
    <b>
    ${document.getElementById("material").value}
    </b>
    <br>
    ضخامت:
    <b>
    ${document.getElementById("thickness").value}
    میلی‌متر
    </b>
    <br>
    ابعاد:
    <b>
    ${sheetWidth} × ${sheetLength}
    </b>
    سانتی‌متر
    <hr>
    تعداد کل قطعات:
    <b>
    ${totalPieces}
    </b>
    <br>
    تعداد ورق موردنیاز:
    <b>
    ${sheets.length}
    </b>
    <br>
    مساحت کل قطعات:
    <b>
    ${totalArea.toLocaleString("fa-IR")}
    </b>
    سانتی‌متر مربع
    <br>
    راندمان کلی:
    <b>
    ${efficiency}%
    </b>
    <br>
    تیغ برش:
    <b>
    ۳ میلی‌متر
    </b>
    `;
    document.getElementById(
    "summaryCard"
    ).style.display="block";
    document.getElementById(
    "layoutCard"
    ).style.display="block";
    renderLayouts(
    sheets,
    sheetWidth,
    sheetLength
    );
    document.getElementById(
    "layoutCard"
    ).scrollIntoView({
        behavior:"smooth"
    });
});
renderParts();
</script>
</body>
</html>
