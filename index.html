<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1e293b">

    <title>کابینت‌یار</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- هدر -->
    <header class="header">
        <h1>کابینت‌یار</h1>
        <p>ابزار حرفه‌ای محاسبات کابینت</p>
    </header>


    <!-- محتوای اصلی -->
    <main class="container">

        <section class="card">

            <h2>ابزارهای کابینت‌یار</h2>

            <div class="menu">

                <!-- محاسبه قیمت کابینت -->
                <button onclick="openPage('price')">
                    <span class="menu-icon">💰</span>
                    محاسبه قیمت کابینت
                </button>


                <!-- نمایش یونیت -->
                <button onclick="openPage('units')">
                    <span class="menu-icon">🗄️</span>
                    نمایش یونیت
                </button>


                <!-- نقشه چیدمان ورق -->
                <button onclick="openPage('cutting')">
                    <span class="menu-icon">📐</span>
                    نقشه چیدمان ورق
                </button>


                <!-- کات مستر -->
                <button onclick="openPage('cutmaster')">
                    <span class="menu-icon">✂️</span>
                    کات مستر
                </button>


                <!-- یراق آلات -->
                <button onclick="openPage('hardware')">
                    <span class="menu-icon">🔩</span>
                    یراق‌آلات
                </button>


                <!-- ثبت سفارش -->
                <button onclick="openPage('orders')">
                    <span class="menu-icon">📝</span>
                    ثبت سفارش مشتری
                </button>


                <!-- محاسبه صفحه کابینت -->
                <button onclick="openPage('countertop')">
                    <span class="menu-icon">📏</span>
                    محاسبه صفحه کابینت
                </button>


                <!-- تماس -->
                <button onclick="openPage('contact')">
                    <span class="menu-icon">📞</span>
                    تماس با ما
                </button>

            </div>

        </section>

    </main>


    <!-- فوتر -->
    <footer class="footer">
        کابینت‌یار © 2026
    </footer>


    <script>

        function openPage(page) {

            if (page === "price") {
                alert("بخش محاسبه قیمت کابینت");
            }

            else if (page === "units") {
                alert("بخش نمایش یونیت");
            }

            else if (page === "cutting") {
                alert("بخش نقشه چیدمان ورق");
            }

            else if (page === "cutmaster") {
                alert("بخش کات مستر");
            }

            else if (page === "hardware") {
                alert("بخش یراق‌آلات");
            }

            else if (page === "orders") {
                alert("بخش ثبت سفارش مشتری");
            }

            else if (page === "countertop") {
                alert("بخش محاسبه صفحه کابینت");
            }

            else if (page === "contact") {
                alert("بخش تماس با ما");
            }

        }

    </script>

</body>
</html>
