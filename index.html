<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1e293b">

    <title>کابینت‌یار</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- هدر -->
    <header class="header">
        <h1>کابینت‌یار</h1>
        <p>ابزار حرفه‌ای کابینت‌سازی</p>
    </header>


    <!-- محتوای اصلی -->
    <main class="container">

        <section class="card">

            <h2>ابزارهای کابینت‌یار</h2>

            <div class="menu">

                <!-- محاسبه قیمت کابینت -->
                <button onclick="window.location.href='price.html'">
                    <span class="menu-icon">💰</span>
                    محاسبه قیمت کابینت
                </button>


                <!-- نمایش یونیت -->
                <button onclick="window.location.href='units.html'">
                    <span class="menu-icon">🗄️</span>
                    نمایش یونیت
                </button>


                <!-- نقشه چیدمان ورق -->
                <button onclick="window.location.href='cutting.html'">
                    <span class="menu-icon">📐</span>
                    نقشه چیدمان ورق
                </button>


                <!-- کات مستر -->
                <button onclick="window.location.href='cutmaster.html'">
                    <span class="menu-icon">✂️</span>
                    کات مستر
                </button>


                <!-- یراق آلات -->
                <button onclick="window.location.href='hardware.html'">
                    <span class="menu-icon">🔩</span>
                    یراق‌آلات
                </button>


                <!-- ثبت سفارش -->
                <button onclick="window.location.href='orders.html'">
                    <span class="menu-icon">📝</span>
                    ثبت سفارش مشتری
                </button>


                <!-- محاسبه صفحه کابینت -->
                <button onclick="window.location.href='countertop.html'">
                    <span class="menu-icon">📏</span>
                    محاسبه صفحه کابینت
                </button>


                <!-- تماس -->
                <button onclick="window.location.href='contact.html'">
                    <span class="menu-icon">📞</span>
                    تماس با ما
                </button>

            </div>

        </section>

    </main>


    <!-- فوتر -->
    <footer class="footer">
        کابینت‌یار © 2026
    </footer>

</body>

</html>
