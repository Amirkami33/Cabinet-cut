<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاکتور مشتری | کابینت‌یار</title>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:tahoma,Arial;

background:#f3f6fa;

color:#1f2937;

padding:20px;

}


.container{

max-width:500px;

margin:auto;

}


.card{

background:white;

border-radius:22px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}


h1,h2{

color:#0f2a4a;

text-align:center;

}


label{

display:block;

margin-top:12px;

font-weight:bold;

}


input,textarea{

width:100%;

padding:13px;

border-radius:12px;

border:1px solid #ddd;

margin-top:6px;

font-size:16px;

}


button{

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:#0f2a4a;

color:white;

font-size:16px;

margin-top:15px;

}


.invoice{

background:#fafafa;

border-radius:18px;

padding:20px;

line-height:2;

border:1px dashed #ccc;

}


.amount{

font-size:22px;

font-weight:bold;

color:#0f2a4a;

}


.small{

color:#666;

font-size:14px;

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>
📄 فاکتور مشتری
</h1>


<label>
نام مشتری
</label>

<input id="customerName">


<label>
شماره مشتری
</label>

<input id="customerPhone">


<label>
مبلغ نهایی (تومان)
</label>

<input 
id="amount"
type="number"
oninput="updateInvoice()"
>


<button onclick="updateInvoice()">
ساخت فاکتور
</button>


</div>




<div class="card">


<h2>
پیش‌نمایش
</h2>


<div class="invoice" id="invoice">


کابینت‌یار

<br>

در انتظار اطلاعات...

</div>


<button onclick="copyInvoice()">

📋 کپی متن فاکتور

</button>


</div>


</div>



<script>


let master =
JSON.parse(
localStorage.getItem("cabinetMaster")
);



function numberToText(num){


let units=[
"",
"یک",
"دو",
"سه",
"چهار",
"پنج",
"شش",
"هفت",
"هشت",
"نه"
];


if(!num)
return "";


return num.toLocaleString("fa-IR");

}



function updateInvoice(){


let name=
document.getElementById("customerName").value;


let phone=
document.getElementById("customerPhone").value;


let amount=
document.getElementById("amount").value;


let masterName =
master ? master.name : "نام استادکار";

let card =
master ? master.card : "-";

let cardName =
master ? master.cardName : "-";

let footer =
master ? master.footer : "با تشکر از اعتماد شما";



document.getElementById("invoice").innerHTML=

`

<b>
کابینت‌یار
</b>

<br><br>


استادکار:
${masterName}


<br><br>


مشتری:
${name || "-"}


<br>

شماره:
${phone || "-"}


<hr>


مبلغ نهایی:

<br>

<div class="amount">

${amount ? Number(amount).toLocaleString("fa-IR") : "0"}

 تومان

</div>


<br>

به حروف:

<br>

${numberToText(amount)}


<hr>


شماره کارت:

<br>

${card}


<br>

به نام:

${cardName}


<hr>


${footer}

`;

}



function copyInvoice(){


let text =
document.getElementById("invoice").innerText;


navigator.clipboard.writeText(text);


alert("متن فاکتور کپی شد ✅");


}


updateInvoice();


</script>


</body>

</html>
