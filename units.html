<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1e293b">

    <title>نمایش یونیت | کابینت‌یار</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<header class="header">

    <h1>نمایش یونیت</h1>

    <p>
        محاسبه قطعات و اندازه برش یونیت
    </p>

</header>


<main class="container">


    <!-- بازگشت -->

    <button class="back-btn"
            onclick="window.location.href='index.html'">

        ← بازگشت به کابینت‌یار

    </button>


    <!-- تنظیمات یونیت -->

    <section class="card">

        <h2>
            مشخصات یونیت
        </h2>


        <!-- نوع یونیت -->

        <div class="form-group">

            <label>
                نوع یونیت
            </label>

            <select id="unitType">

                <option value="base">
                    یونیت زمینی
                </option>

                <option value="wall">
                    یونیت دیواری
                </option>

                <option value="tall">
                    یونیت ایستاده
                </option>

                <option value="sink">
                    یونیت سینک
                </option>

                <option value="drawer">
                    یونیت کشویی
                </option>

            </select>

        </div>


        <!-- عرض -->

        <div class="form-group">

            <label>
                عرض یونیت (میلی‌متر)
            </label>

            <input
                type="number"
                id="unitWidth"
                placeholder="مثلاً 800"
                min="100"
            >

        </div>


        <!-- ارتفاع -->

        <div class="form-group">

            <label>
                ارتفاع کلی یونیت (میلی‌متر)
            </label>

            <input
                type="number"
                id="unitHeight"
                placeholder="مثلاً 900"
                min="100"
            >

        </div>


        <!-- عمق -->

        <div class="form-group">

            <label>
                عمق یونیت (میلی‌متر)
            </label>

            <input
                type="number"
                id="unitDepth"
                placeholder="مثلاً 580"
                min="100"
            >

        </div>


        <!-- ضخامت ورق -->

        <div class="form-group">

            <label>
                ضخامت ورق بدنه
            </label>

            <select id="boardThickness">

                <option value="16">
                    16 میلی‌متر
                </option>

                <option value="18">
                    18 میلی‌متر
                </option>

            </select>

        </div>


        <!-- پایه -->

        <div class="form-group">

            <label>
                ارتفاع پایه
            </label>

            <select id="baseHeight">

                <option value="50">
                    5 سانتی‌متر
                </option>

                <option value="60">
                    6 سانتی‌متر
                </option>

                <option value="70">
                    7 سانتی‌متر
                </option>

                <option value="80">
                    8 سانتی‌متر
                </option>

                <option value="90">
                    9 سانتی‌متر
                </option>

                <option value="100">
                    10 سانتی‌متر
                </option>

                <option value="110">
                    11 سانتی‌متر
                </option>

                <option value="120">
                    12 سانتی‌متر
                </option>

                <option value="130">
                    13 سانتی‌متر
                </option>

                <option value="140">
                    14 سانتی‌متر
                </option>

            </select>

        </div>


        <!-- نوع پشت -->

        <div class="form-group">

            <label>
                نوع پشت یونیت
            </label>

            <select id="backType">

                <option value="3">
                    پشت 3 میل
                </option>

                <option value="8">
                    MDF معمولی
                </option>

                <option value="5">
                    فومیزه
                </option>

            </select>

        </div>


        <!-- ضخامت نوار -->

        <div class="form-group">

            <label>
                ضخامت نوار
            </label>

            <select id="edgeThickness">

                <option value="1">
                    1 میلی‌متر
                </option>

                <option value="2">
                    2 میلی‌متر
                </option>

            </select>

        </div>


        <!-- تعداد لبه نوار کف -->

        <div class="form-group">

            <label>
                تعداد لبه نوار کف
            </label>

            <select id="floorEdges">

                <option value="0">
                    بدون نوار
                </option>

                <option value="1">
                    یک لبه
                </option>

                <option value="2">
                    دو لبه
                </option>

            </select>

        </div>


        <button
            class="btn"
            onclick="calculateUnit()">

            محاسبه یونیت

        </button>

    </section>


    <!-- نتیجه -->

    <section
        class="card"
        id="resultSection"
        style="display:none;">

        <h2>
            نتیجه محاسبات
        </h2>


        <div
            class="result"
            id="summary">

        </div>

    </section>


    <!-- جدول قطعات -->

    <section
        class="card"
        id="partsSection"
        style="display:none;">

        <h2>
            لیست قطعات
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            قطعه
                        </th>

                        <th>
                            تعداد
                        </th>

                        <th>
                            طول
                        </th>

                        <th>
                            عرض
                        </th>

                        <th>
                            نوار
                        </th>

                    </tr>

                </thead>


                <tbody id="partsTable">

                </tbody>

            </table>

        </div>

    </section>


</main>


<footer class="footer">

    کابینت‌یار © 2026

</footer>


<script>


function calculateUnit() {


    /*
     * دریافت اطلاعات
     */

    const width =
        Number(
            document.getElementById(
                "unitWidth"
            ).value
        );


    const height =
        Number(
            document.getElementById(
                "unitHeight"
            ).value
        );


    const depth =
        Number(
            document.getElementById(
                "unitDepth"
            ).value
        );


    const thickness =
        Number(
            document.getElementById(
                "boardThickness"
            ).value
        );


    const base =
        Number(
            document.getElementById(
                "baseHeight"
            ).value
        );


    const edge =
        Number(
            document.getElementById(
                "edgeThickness"
            ).value
        );


    const floorEdges =
        Number(
            document.getElementById(
                "floorEdges"
            ).value
        );


    const backType =
        Number(
            document.getElementById(
                "backType"
            ).value
        );


    /*
     * بررسی اطلاعات
     */

    if (
        width <= 0 ||
        height <= 0 ||
        depth <= 0
    ) {

        alert(
            "لطفاً عرض، ارتفاع و عمق یونیت را وارد کنید."
        );

        return;

    }


    /*
     * محاسبه ارتفاع بغل
     *
     * ارتفاع کل
     * منهای پایه
     * منهای ضخامت کف
     */

    const sideHeight =
        height -
        base -
        thickness;


    /*
     * عرض قطعاتی که بین بغل‌ها قرار می‌گیرند
     */

    const innerWidth =
        width -
        (thickness * 2);


    /*
     * محاسبه عمق کف
     *
     * عمق خام
     * منهای مقدار نوار
     */

    const floorDepth =
        depth -
        (
            edge *
            floorEdges
        );


    /*
     * جدول قطعات
     */

    const table =
        document.getElementById(
            "partsTable"
        );


    table.innerHTML = "";


    /*
     * بغل اول
     */

    addPart(
        "بغل یونیت",
        2,
        sideHeight,
        depth,
        "طبق تنظیمات"
    );


    /*
     * کف
     */

    addPart(
        "کف",
        1,
        innerWidth,
        floorDepth,
        floorEdges +
        " لبه"
    );


    /*
     * قید جلو 7 سانتی
     */

    addPart(
        "قید جلو 7 سانتی",
        1,
        innerWidth,
        70,
        "بدون نوار"
    );


    /*
     * قید جلو 5 سانتی
     */

    addPart(
        "قید جلو 5 سانتی",
        1,
        innerWidth,
        50,
        "بدون نوار"
    );


    /*
     * قید پشت 7 سانتی
     */

    addPart(
        "قید پشت 7 سانتی",
        1,
        innerWidth,
        70,
        "بدون نوار"
    );


    /*
     * قید پشت 5 سانتی
     */

    addPart(
        "قید پشت 5 سانتی",
        1,
        innerWidth,
        50,
        "بدون نوار"
    );


    /*
     * پشت
     */

    const backWidth =
        innerWidth;


    const backHeight =
        sideHeight;


    addPart(
        "پشت",
        1,
        backWidth,
        backHeight,
        "بدون نوار"
    );


    /*
     * نمایش نتیجه
     */

    document.getElementById(
        "resultSection"
    ).style.display = "block";


    document.getElementById(
        "partsSection"
    ).style.display = "block";


    /*
     * خلاصه
     */

    document.getElementById(
        "summary"
    ).innerHTML = `

        <p>
            <strong>
                عرض یونیت:
            </strong>

            ${width} میلی‌متر
        </p>


        <p>
            <strong>
                ارتفاع کلی:
            </strong>

            ${height} میلی‌متر
        </p>


        <p>
            <strong>
                عمق:
            </strong>

            ${depth} میلی‌متر
        </p>


        <p>
            <strong>
                ارتفاع پایه:
            </strong>

            ${base} میلی‌متر
        </p>


        <p>
            <strong>
                ارتفاع بغل:
            </strong>

            ${sideHeight} میلی‌متر
        </p>


        <p>
            <strong>
                ضخامت ورق:
            </strong>

            ${thickness} میلی‌متر
        </p>


        <p>
            <strong>
                ضخامت نوار:
            </strong>

            ${edge} میلی‌متر
        </p>

    `;

}


/*
 * اضافه کردن قطعه به جدول
 */

function addPart(
    name,
    quantity,
    length,
    width,
    edge
) {


    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>
            ${name}
        </td>

        <td>
            ${quantity}
        </td>

        <td>
            ${length}
        </td>

        <td>
            ${width}
        </td>

        <td>
            ${edge}
        </td>

    `;


    table.appendChild(row);

}


</script>

</body>

</html>
