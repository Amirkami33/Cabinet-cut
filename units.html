<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f2a4a"
    >

    <title>نمایش یونیت | کابینت‌یار</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .unit-option-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .hidden {
            display: none !important;
        }

        .parts-table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .parts-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        .parts-table th,
        .parts-table td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .parts-table th {
            background: #0f2a4a;
            color: white;
        }

        .part-number {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #0f2a4a;
            color: white;
            font-weight: bold;
        }

        .direction-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 8px;
            background: #edf4fb;
            color: #0f2a4a;
            font-size: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .summary-item {
            background: #f6f8fb;
            border-radius: 14px;
            padding: 12px;
        }

        .summary-item strong {
            display: block;
            color: #0f2a4a;
            margin-bottom: 5px;
        }

        .drawing-box {
            width: 100%;
            overflow-x: auto;
            text-align: center;
            padding: 10px 0;
        }

        .drawing-box svg {
            max-width: 100%;
            height: auto;
        }

        .mode-title {
            margin-top: 5px;
            margin-bottom: 10px;
            color: #0f2a4a;
            font-weight: bold;
        }

        .exploded-info {
            margin-top: 12px;
            padding: 12px;
            border-radius: 14px;
            background: #f6f8fb;
            line-height: 2;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .unit-option-box {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<script>


/* =====================================================
   تبدیل اندازه
===================================================== */

function parseMeasurement(value) {

    if (!value) {
        return NaN;
    }

    value = value
        .toString()
        .trim();

    const persian =
        ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

    const arabic =
        ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];

    for (let i = 0; i < 10; i++) {

        value = value.replaceAll(
            persian[i],
            i
        );

        value = value.replaceAll(
            arabic[i],
            i
        );

    }

    value = value
        .replaceAll(",", ".")
        .replaceAll("/", ".");

    return Number(value);

}


/* =====================================================
   فرمت اندازه
===================================================== */

function formatMeasurement(number) {

    if (
        number === undefined ||
        number === null ||
        Number.isNaN(number)
    ) {

        return "---";

    }

    return Number(
        number.toFixed(2)
    )
    .toString()
    .replace(".", "/");

}


/* =====================================================
   نام یونیت
===================================================== */

function getUnitName(type) {

    const names = {

        base: "یونیت زمینی",

        wall: "یونیت دیواری",

        tall: "یونیت ایستاده",

        sink: "یونیت سینک",

        drawer: "یونیت کشویی"

    };

    return names[type] || "---";

}


/* =====================================================
   تغییر نوع یونیت
===================================================== */

function unitTypeChanged() {

    const type =
        document.getElementById(
            "unitType"
        ).value;

    const baseGroup =
        document.getElementById(
            "baseHeightGroup"
        );

    /*
       باکس دیواری پایه ندارد
    */

    if (type === "wall") {

        baseGroup.classList.add(
            "hidden"
        );

    }

    else {

        baseGroup.classList.remove(
            "hidden"
        );

    }

}


/* =====================================================
   اضافه کردن قطعه
===================================================== */

let partNumber = 0;

let currentParts = [];


function addPart(
    name,
    quantity,
    length,
    width,
    direction,
    edge
) {

    partNumber++;

    const part = {

        number: partNumber,

        name: name,

        quantity: quantity,

        length: length,

        width: width,

        direction: direction,

        edge: edge

    };

    currentParts.push(part);


    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>

            <span class="part-number">

                ${partNumber}

            </span>

        </td>


        <td>

            ${name}

        </td>


        <td>

            ${quantity}

        </td>


        <td>

            ${formatMeasurement(length)}

        </td>


        <td>

            ${formatMeasurement(width)}

        </td>


        <td>

            <span class="direction-badge">

                ${direction}

            </span>

        </td>


        <td>

            ${edge}

        </td>

    `;


    table.appendChild(row);

}


/* =====================================================
   محاسبه یونیت
===================================================== */

function calculateUnit() {


    const thickness =
        Number(
            document.getElementById(
                "boardThickness"
            ).value
        );


    const edgeThickness =
        Number(
            document.getElementById(
                "edgeThickness"
            ).value
        );


    const doorGap =
        Number(
            document.getElementById(
                "doorGap"
            ).value
        );


    const baseHeight =
        Number(
            document.getElementById(
                "baseHeight"
            ).value
        );


    const backThickness =
        Number(
            document.getElementById(
                "backType"
            ).value
        );


    const width =
        parseMeasurement(
            document.getElementById(
                "unitWidth"
            ).value
        );


    const height =
        parseMeasurement(
            document.getElementById(
                "unitHeight"
            ).value
        );


    const depth =
        parseMeasurement(
            document.getElementById(
                "unitDepth"
            ).value
        );


    const doorCount =
        Number(
            document.getElementById(
                "doorCount"
            ).value
        );


    const shelfCount =
        Number(
            document.getElementById(
                "shelfCount"
            ).value
        );


    const unitType =
        document.getElementById(
            "unitType"
        ).value;


    const doorMode =
        document.getElementById(
            "doorMode"
        ).value;


    /* =================================================
       بررسی
    ================================================= */

    if (
        Number.isNaN(width) ||
        Number.isNaN(height) ||
        Number.isNaN(depth) ||
        width <= 0 ||
        height <= 0 ||
        depth <= 0
    ) {

        alert(
            "لطفاً عرض، ارتفاع و عمق یونیت را درست وارد کنید."
        );

        return;

    }


    /* پاک کردن قطعات */

    partNumber = 0;

    currentParts = [];


    document.getElementById(
        "partsTable"
    ).innerHTML = "";


    /* =================================================
       باکس دیواری
    ================================================= */

    if (unitType === "wall") {

        calculateWallUnit(
            width,
            height,
            depth,
            thickness,
            edgeThickness,
            doorGap,
            backThickness,
            doorCount,
            shelfCount,
            doorMode
        );

        return;

    }


    /* =================================================
       یونیت زمینی و سایر مدل‌ها
    ================================================= */

    calculateBaseUnit(
        width,
        height,
        depth,
        baseHeight,
        thickness,
        edgeThickness,
        doorGap,
        doorCount,
        shelfCount,
        unitType
    );

}


/* =====================================================
   محاسبه باکس دیواری
===================================================== */

function calculateWallUnit(
    width,
    height,
    depth,
    thickness,
    edgeThickness,
    doorGap,
    backThickness,
    doorCount,
    shelfCount,
    doorMode
) {


    /*
       سقف روی بغل‌هاست.

       بنابراین ارتفاع بغل:
       ارتفاع کلی - ضخامت سقف
    */

    const sideHeight =
        height - thickness;


    /*
       کف بین دو بغل قرار دارد.
    */

    const innerWidth =
        width - (
            thickness * 2
        );


    /*
       عمق طبق قاعده فعلی:
       بدون کاهش به خاطر پشت
    */

    const partDepth =
        depth;


    /* =================================================
       بغل‌ها
    ================================================= */

    addPart(
        "بغل چپ",
        1,
        sideHeight,
        partDepth,
        "عمودی",
        "لبه جلو"
    );


    addPart(
        "بغل راست",
        1,
        sideHeight,
        partDepth,
        "عمودی",
        "لبه جلو"
    );


    /* =================================================
       کف
    ================================================= */

    addPart(
        "کف",
        1,
        innerWidth,
        partDepth,
        "افقی",
        "لبه جلو"
    );


    /* =================================================
       سقف
    ================================================= */

    addPart(
        "سقف",
        1,
        width,
        depth,
        "افقی",
        "لبه جلو"
    );


    /* =================================================
       طبقات
    ================================================= */

    for (
        let i = 1;
        i <= shelfCount;
        i++
    ) {

        addPart(
            "طبقه " + i,
            1,
            innerWidth,
            partDepth,
            "افقی",
            "لبه جلو"
        );

    }


    /* =================================================
       قید جلو
    ================================================= */

    addPart(
        "قید جلو",
        1,
        innerWidth,
        7,
        "افقی",
        "بدون نوار"
    );


    /* =================================================
       قید پشت
    ================================================= */

    addPart(
        "قید پشت",
        1,
        innerWidth,
        7,
        "افقی",
        "بدون نوار"
    );


    /* =================================================
       پشت
    ================================================= */

    addPart(
        "پشت",
        1,
        width,
        height,
        "عمودی",
        "بدون نوار"
    );


    /* =================================================
       درب
    ================================================= */

    let doorWidth;

    let doorHeight;


    if (
        doorMode === "vertical"
    ) {

        /*
           درب عمودی:
           تقسیم عرض
        */

        doorHeight =
            height -
            (
                doorGap * 2
            );


        if (doorCount === 1) {

            doorWidth =
                width -
                (
                    doorGap * 2
                );

        }

        else {

            doorWidth =
                (
                    width -
                    (
                        doorGap *
                        (
                            doorCount + 1
                        )
                    )
                ) /
                doorCount;

        }


        for (
            let i = 1;
            i <= doorCount;
            i++
        ) {

            addPart(
                "درب " + i,
                1,
                doorHeight,
                doorWidth,
                "عمودی",
                "لبه دور درب"
            );

        }

    }


    else {

        /*
           درب افقی:
           تقسیم ارتفاع
        */

        doorWidth =
            width -
            (
                doorGap * 2
            );


        if (doorCount === 1) {

            doorHeight =
                height -
                (
                    doorGap * 2
                );

        }

        else {

            doorHeight =
                (
                    height -
                    (
                        doorGap *
                        (
                            doorCount + 1
                        )
                    )
                ) /
                doorCount;

        }


        for (
            let i = 1;
            i <= doorCount;
            i++
        ) {

            addPart(
                "درب " + i,
                1,
                doorWidth,
                doorHeight,
                "افقی",
                "لبه دور درب"
            );

        }

    }


    /* =================================================
       نمایش
    ================================================= */

    showResults();


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="summary-item">

            <strong>
                نوع یونیت
            </strong>

            یونیت دیواری

        </div>


        <div class="summary-item">

            <strong>
                ابعاد کلی
            </strong>

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}

            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                ارتفاع بغل
            </strong>

            ${formatMeasurement(sideHeight)}
            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                تعداد طبقات
            </strong>

            ${shelfCount}

        </div>


        <div class="summary-item">

            <strong>
                نوع درب
            </strong>

            ${
                doorMode === "vertical"
                ? "عمودی"
                : "افقی"
            }

        </div>


        <div class="summary-item">

            <strong>
                تعداد درب
            </strong>

            ${doorCount}

        </div>


        <div class="summary-item">

            <strong>
                ضخامت ورق
            </strong>

            ${formatMeasurement(thickness)}
            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                پشت
            </strong>

            ${formatMeasurement(backThickness)}
            سانتی‌متر

        </div>

    `;


    drawWallUnit(
        width,
        height,
        depth,
        thickness,
        shelfCount,
        doorCount,
        doorMode
    );

}


/* =====================================================
   یونیت زمینی
===================================================== */

function calculateBaseUnit(
    width,
    height,
    depth,
    baseHeight,
    thickness,
    edgeThickness,
    doorGap,
    doorCount,
    shelfCount,
    unitType
) {


    const boxHeight =
        height -
        baseHeight;


    const sideHeight =
        height -
        baseHeight -
        thickness;


    const innerWidth =
        width -
        (
            thickness * 2
        );


    addPart(
        "بغل چپ",
        1,
        sideHeight,
        depth,
        "عمودی",
        "لبه جلو"
    );


    addPart(
        "بغل راست",
        1,
        sideHeight,
        depth,
        "عمودی",
        "لبه جلو"
    );


    addPart(
        "کف",
        1,
        innerWidth,
        depth - edgeThickness,
        "افقی",
        "لبه جلو"
    );


    addPart(
        "قید جلو 7 سانتی",
        1,
        innerWidth,
        7,
        "افقی",
        "بدون نوار"
    );


    addPart(
        "قید جلو 5 سانتی",
        1,
        innerWidth,
        5,
        "افقی",
        "بدون نوار"
    );


    addPart(
        "قید پشت 7 سانتی",
        1,
        innerWidth,
        7,
        "افقی",
        "بدون نوار"
    );


    addPart(
        "قید پشت 5 سانتی",
        1,
        innerWidth,
        5,
        "افقی",
        "بدون نوار"
    );


    addPart(
        "پشت",
        1,
        width,
        boxHeight,
        "عمودی",
        "بدون نوار"
    );


    /* طبقات */

    for (
        let i = 1;
        i <= shelfCount;
        i++
    ) {

        addPart(
            "طبقه " + i,
            1,
            innerWidth,
            depth,
            "افقی",
            "لبه جلو"
        );

    }


    /* درب */

    const doorHeight =
        boxHeight -
        (
            doorGap * 2
        );


    let doorWidth;


    if (doorCount === 1) {

        doorWidth =
            width -
            (
                doorGap * 2
            );

    }

    else {

        doorWidth =
            (
                width -
                (
                    doorGap *
                    (
                        doorCount + 1
                    )
                )
            ) /
            doorCount;

    }


    for (
        let i = 1;
        i <= doorCount;
        i++
    ) {

        addPart(
            "درب " + i,
            1,
            doorWidth - edgeThickness,
            doorHeight - edgeThickness,
            "عمودی",
            "لبه دور درب"
        );

    }


    showResults();


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="summary-item">

            <strong>
                نوع یونیت
            </strong>

            ${getUnitName(unitType)}

        </div>


        <div class="summary-item">

            <strong>
                ابعاد کلی
            </strong>

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}

            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                ارتفاع باکس
            </strong>

            ${formatMeasurement(boxHeight)}
            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                ارتفاع بغل
            </strong>

            ${formatMeasurement(sideHeight)}
            سانتی‌متر

        </div>


        <div class="summary-item">

            <strong>
                تعداد طبقات
            </strong>

            ${shelfCount}

        </div>


        <div class="summary-item">

            <strong>
                تعداد درب
            </strong>

            ${doorCount}

        </div>


        <div class="summary-item">

            <strong>
                ارتفاع پایه
            </strong>

            ${formatMeasurement(baseHeight)}
            سانتی‌متر

        </div>

    `;


    drawBaseUnit(
        width,
        height,
        depth,
        baseHeight,
        thickness,
        doorCount,
        unitType
    );

}


/* =====================================================
   نمایش نتایج
===================================================== */

function showResults() {

    document.getElementById(
        "resultSection"
    ).style.display = "block";


    document.getElementById(
        "partsSection"
    ).style.display = "block";


    document.getElementById(
        "unitViewSection"
    ).style.display = "block";

}


/* =====================================================
   رسم باکس دیواری
===================================================== */

function drawWallUnit(
    width,
    height,
    depth,
    thickness,
    shelfCount,
    doorCount,
    doorMode
) {


    const drawing =
        document.getElementById(
            "unitDrawing"
        );


    const exploded =
        document.getElementById(
            "explodedDrawing"
        );


    const svgWidth = 620;

    const svgHeight = 430;

    const x = 110;

    const y = 70;

    const bodyWidth = 400;

    const bodyHeight = 270;


    const shelfArea =
        bodyHeight -
        45;


    let svg = `

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${svgWidth}"
        height="${svgHeight}"
        viewBox="0 0 ${svgWidth} ${svgHeight}"
    >

        <text
            x="310"
            y="35"
            text-anchor="middle"
            font-size="20"
            font-weight="bold"
            fill="#0f2a4a"
        >

            یونیت دیواری

        </text>


        <!-- بدنه -->

        <rect
            x="${x}"
            y="${y}"
            width="${bodyWidth}"
            height="${bodyHeight}"
            fill="#e5edf5"
            stroke="#0f172a"
            stroke-width="3"
        />


        <!-- بغل چپ -->

        <rect
            x="${x}"
            y="${y}"
            width="22"
            height="${bodyHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />


        <!-- بغل راست -->

        <rect
            x="${x + bodyWidth - 22}"
            y="${y}"
            width="22"
            height="${bodyHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />


        <!-- سقف -->

        <rect
            x="${x}"
            y="${y}"
            width="${bodyWidth}"
            height="16"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />


        <!-- کف -->

        <rect
            x="${x + 22}"
            y="${y + bodyHeight - 16}"
            width="${bodyWidth - 44}"
            height="16"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />

    `;


    /* طبقات */

    if (shelfCount > 0) {

        const available =
            bodyHeight - 45;

        const gap =
            available /
            (shelfCount + 1);


        for (
            let i = 1;
            i <= shelfCount;
            i++
        ) {

            const shelfY =
                y +
                25 +
                gap * i;


            svg += `

                <rect
                    x="${x + 22}"
                    y="${shelfY}"
                    width="${bodyWidth - 44}"
                    height="8"
                    fill="#64748b"
                    stroke="#0f172a"
                    stroke-width="1"
                />

            `;

        }

    }


    /* درب‌ها */

    const doorX =
        x + 25;

    const doorY =
        y + 25;

    const doorWidth =
        bodyWidth - 50;

    const doorHeight =
        bodyHeight - 50;


    if (
        doorMode === "vertical"
    ) {

        const gap = 5;

        const singleWidth =
            (
                doorWidth -
                gap *
                (
                    doorCount - 1
                )
            ) /
            doorCount;


        for (
            let i = 0;
            i < doorCount;
            i++
        ) {

            svg += `

                <rect
                    x="${
                        doorX +
                        i *
                        (
                            singleWidth +
                            gap
                        )
                    }"
                    y="${doorY}"
                    width="${singleWidth}"
                    height="${doorHeight}"
                    fill="#f8fafc"
                    stroke="#0f172a"
                    stroke-width="2"
                    rx="3"
                />

            `;

        }

    }

    else {

        const gap = 5;

        const singleHeight =
            (
                doorHeight -
                gap *
                (
                    doorCount - 1
                )
            ) /
            doorCount;


        for (
            let i = 0;
            i < doorCount;
            i++
        ) {

            svg += `

                <rect
                    x="${doorX}"
                    y="${
                        doorY +
                        i *
                        (
                            singleHeight +
                            gap
                        )
                    }"
                    width="${doorWidth}"
                    height="${singleHeight}"
                    fill="#f8fafc"
                    stroke="#0f172a"
                    stroke-width="2"
                    rx="3"
                />

            `;

        }

    }


    /* خط اندازه عرض */

    svg += `

        <line
            x1="${x}"
            y1="${y + bodyHeight + 35}"
            x2="${x + bodyWidth}"
            y2="${y + bodyHeight + 35}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x + bodyWidth / 2}"
            y="${y + bodyHeight + 58}"
            text-anchor="middle"
            font-size="15"
            fill="#334155"
        >

            عرض:
            ${formatMeasurement(width)}
            سانت

        </text>


        <!-- ارتفاع -->

        <line
            x1="${x - 35}"
            y1="${y}"
            x2="${x - 35}"
            y2="${y + bodyHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x - 48}"
            y="${y + bodyHeight / 2}"
            text-anchor="middle"
            font-size="15"
            fill="#334155"
            transform="
                rotate(
                    -90
                    ${x - 48}
                    ${y + bodyHeight / 2}
                )
            "
        >

            ارتفاع:
            ${formatMeasurement(height)}
            سانت

        </text>


    </svg>

    `;


    drawing.innerHTML = svg;


    drawExplodedWallUnit(
        width,
        height,
        depth,
        thickness,
        shelfCount
    );


    document.getElementById(
        "drawingInfo"
    ).innerHTML = `

        <strong>
            یونیت دیواری
        </strong>

        <br>

        عرض:
        ${formatMeasurement(width)}
        سانت

        |

        ارتفاع:
        ${formatMeasurement(height)}
        سانت

        |

        عمق:
        ${formatMeasurement(depth)}
        سانت

        <br>

        ضخامت ورق:
        ${formatMeasurement(thickness)}
        سانت

        |

        تعداد طبقات:
        ${shelfCount}

        <br>

        کف داخل بغل‌ها قرار می‌گیرد.

        <br>

        سقف روی بغل‌ها قرار می‌گیرد.

    `;

}


/* =====================================================

    /*

/* =====================================================
   نمای ساده یونیت زمینی
===================================================== */

function drawBaseUnit(
    width,
    height,
    depth,
    baseHeight,
    thickness,
    doorCount,
    unitType
) {


    const drawing =
        document.getElementById(
            "unitDrawing"
        );


    const svgWidth = 620;

    const svgHeight = 430;

    const x = 110;

    const y = 60;

    const bodyWidth = 400;

    const bodyHeight = 280;


    const basePixelHeight =
        Math.max(
            35,
            bodyHeight *
            (
                baseHeight /
                height
            )
        );


    const boxPixelHeight =
        bodyHeight -
        basePixelHeight;


    let svg = `

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${svgWidth}"
        height="${svgHeight}"
        viewBox="0 0 ${svgWidth} ${svgHeight}"
    >

        <text
            x="310"
            y="32"
            text-anchor="middle"
            font-size="20"
            font-weight="bold"
            fill="#0f2a4a"
        >

            ${getUnitName(unitType)}

        </text>


        <!-- بدنه -->

        <rect
            x="${x}"
            y="${y}"
            width="${bodyWidth}"
            height="${boxPixelHeight}"
            fill="#e5edf5"
            stroke="#0f172a"
            stroke-width="3"
        />


        <!-- درب -->

    `;


    const doorAreaX =
        x + 24;

    const doorAreaWidth =
        bodyWidth - 48;


    const doorAreaY =
        y + 45;

    const doorAreaHeight =
        boxPixelHeight - 55;


    const gap = 5;


    const singleDoorWidth =
        (
            doorAreaWidth -
            gap *
            (
                doorCount - 1
            )
        ) /
        doorCount;


    for (
        let i = 0;
        i < doorCount;
        i++
    ) {

        svg += `

            <rect
                x="${
                    doorAreaX +
                    i *
                    (
                        singleDoorWidth +
                        gap
                    )
                }"
                y="${doorAreaY}"
                width="${singleDoorWidth}"
                height="${doorAreaHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
            />

        `;

    }


    /* پایه */

    svg += `

        <rect
            x="${x + 35}"
            y="${y + boxPixelHeight}"
            width="65"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
        />


        <rect
            x="${x + bodyWidth - 100}"
            y="${y + boxPixelHeight}"
            width="65"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
        />


        <text
            x="310"
            y="${y + bodyHeight + 45}"
            text-anchor="middle"
            font-size="15"
            fill="#334155"
        >

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}
            سانت

        </text>


    </svg>

    `;


    drawing.innerHTML = svg;


    document.getElementById(
        "explodedDrawing"
    ).innerHTML = "";


    document.getElementById(
        "drawingInfo"
    ).innerHTML = `

        <strong>
            ${getUnitName(unitType)}
        </strong>

        <br>

        عرض:
        ${formatMeasurement(width)}

        |

        ارتفاع:
        ${formatMeasurement(height)}

        |

        عمق:
        ${formatMeasurement(depth)}

        سانت

        <br>

        پایه:
        ${formatMeasurement(baseHeight)}
        سانت

    `;

}
