<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1e293b">

    <title>نمایش یونیت | کابینت‌یار</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<header class="header">

    <h1>نمایش یونیت</h1>

    <p>
        محاسبه دقیق قطعات یونیت کابینت
    </p>

</header>


<main class="container">


    <!-- بازگشت -->

    <button
        class="back-btn"
        onclick="window.location.href='index.html'">

        ← بازگشت به کابینت‌یار

    </button>


    <!-- ========================= -->
    <!-- تنظیمات اصلی -->
    <!-- ========================= -->

    <section class="card">

        <h2>
            تنظیمات ساخت
        </h2>


        <!-- ضخامت ورق -->

        <div class="form-group">

            <label>
                ضخامت ورق بدنه
            </label>

            <select id="boardThickness">

                <option value="1.6">
                    16 میل
                </option>

                <option value="1.8">
                    18 میل
                </option>

            </select>

        </div>


        <!-- ضخامت نوار -->

        <div class="form-group">

            <label>
                ضخامت نوار
            </label>

            <select id="edgeThickness">

                <option value="0.1">
                    1 میل
                </option>

                <option value="0.2" selected>
                    2 میل
                </option>

            </select>

        </div>


        <!-- بادخور -->

        <div class="form-group">

            <label>
                بادخور درب
            </label>

            <select id="doorGap">

                <option value="0.2">
                    2 میل
                </option>

                <option value="0.3">
                    3 میل
                </option>

                <option value="0.4">
                    4 میل
                </option>

            </select>

        </div>


        <!-- پایه -->

        <div class="form-group">

            <label>
                ارتفاع پایه
            </label>

            <select id="baseHeight">

                <option value="5">
                    5 سانت
                </option>

                <option value="6">
                    6 سانت
                </option>

                <option value="7">
                    7 سانت
                </option>

                <option value="8">
                    8 سانت
                </option>

                <option value="9">
                    9 سانت
                </option>

                <option value="10">
                    10 سانت
                </option>

                <option value="11">
                    11 سانت
                </option>

                <option value="12">
                    12 سانت
                </option>

                <option value="13">
                    13 سانت
                </option>

                <option value="14" selected>
                    14 سانت
                </option>

            </select>

        </div>


        <!-- پشت -->

        <div class="form-group">

            <label>
                نوع پشت
            </label>

            <select id="backType">

                <option value="0.3">
                    پشت 3 میل
                </option>

                <option value="0.8">
                    MDF معمولی
                </option>

                <option value="0.5">
                    فومیزه
                </option>

            </select>

        </div>

    </section>


    <!-- ========================= -->
    <!-- مشخصات یونیت -->
    <!-- ========================= -->

    <section class="card">

        <h2>
            مشخصات یونیت
        </h2>


        <!-- نوع -->

        <div class="form-group">

            <label>
                نوع یونیت
            </label>

            <select id="unitType">

                <option value="base">
                    یونیت زمینی
                </option>

                <option value="wall">
                    یونیت دیواری
                </option>

                <option value="tall">
                    یونیت ایستاده
                </option>

                <option value="sink">
                    یونیت سینک
                </option>

                <option value="drawer">
                    یونیت کشویی
                </option>

            </select>

        </div>


        <!-- عرض -->

        <div class="form-group">

            <label>
                عرض یونیت (سانتی‌متر)
            </label>

            <input
                type="text"
                id="unitWidth"
                inputmode="decimal"
                placeholder="مثلاً 80 یا 80/5">

        </div>


        <!-- ارتفاع -->

        <div class="form-group">

            <label>
                ارتفاع کلی یونیت (سانتی‌متر)
            </label>

            <input
                type="text"
                id="unitHeight"
                inputmode="decimal"
                placeholder="مثلاً 90">

        </div>


        <!-- عمق -->

        <div class="form-group">

            <label>
                عمق یونیت (سانتی‌متر)
            </label>

            <input
                type="text"
                id="unitDepth"
                inputmode="decimal"
                placeholder="مثلاً 58">

        </div>


        <!-- تعداد درب -->

        <div class="form-group">

            <label>
                تعداد درب
            </label>

            <select id="doorCount">

                <option value="1">
                    یک درب
                </option>

                <option value="2">
                    دو درب
                </option>

            </select>

        </div>


        <button
            class="btn"
            onclick="calculateUnit()">

            محاسبه یونیت

        </button>

    </section>


    <!-- ========================= -->
    <!-- خلاصه -->
    <!-- ========================= -->

    <section
        class="card"
        id="resultSection"
        style="display:none;">

        <h2>
            خلاصه محاسبات
        </h2>

        <div
            class="result"
            id="summary">

        </div>

    </section>


    <!-- ========================= -->
    <!-- قطعات -->
    <!-- ========================= -->

    <section
        class="card"
        id="partsSection"
        style="display:none;">

        <h2>
            لیست برش
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            قطعه
                        </th>

                        <th>
                            تعداد
                        </th>

                        <th>
                            طول
                        </th>

                        <th>
                            عرض
                        </th>

                        <th>
                            نوار
                        </th>

                    </tr>

                </thead>


                <tbody id="partsTable">

                </tbody>

            </table>

        </div>

    </section>


</main>


<footer class="footer">

    کابینت‌یار © 2026

</footer>


<script>


/* =================================================
   تبدیل عدد فارسی و /
================================================= */

function parseMeasurement(value) {

    if (!value) {
        return NaN;
    }

    value = value.toString().trim();


    const persian =
        ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

    const arabic =
        ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];


    for (let i = 0; i < 10; i++) {

        value = value.replaceAll(
            persian[i],
            i
        );

        value = value.replaceAll(
            arabic[i],
            i
        );

    }


    value = value
        .replaceAll(",", ".")
        .replaceAll("/", ".");


    return Number(value);
}



/* =================================================
   نمایش اندازه
================================================= */

function formatMeasurement(number) {

    if (
        number === undefined ||
        number === null ||
        Number.isNaN(number)
    ) {
        return "---";
    }


    let result =
        Number(
            number.toFixed(2)
        );


    return result
        .toString()
        .replace(".", "/");
}



/* =================================================
   محاسبه اندازه با نوار
================================================= */

/*
    اگر یک جهت نوار داشته باشد:

    اندازه خام - ضخامت نوار

    فقط یک بار کم می‌شود.

    دو لبه بودن فقط در علامت نمایش داده می‌شود.
*/

function edgeSize(
    size,
    hasEdge,
    edgeThickness
) {

    if (!hasEdge) {
        return size;
    }


    return size - edgeThickness;
}



/* =================================================
   محاسبه یونیت
================================================= */

function calculateUnit() {


    /* تنظیمات */

    const thickness =
        Number(
            document.getElementById(
                "boardThickness"
            ).value
        );


    const edgeThickness =
        Number(
            document.getElementById(
                "edgeThickness"
            ).value
        );


    const doorGap =
        Number(
            document.getElementById(
                "doorGap"
            ).value
        );


    const baseHeight =
        Number(
            document.getElementById(
                "baseHeight"
            ).value
        );


    const backThickness =
        Number(
            document.getElementById(
                "backType"
            ).value
        );


    /* مشخصات یونیت */

    const width =
        parseMeasurement(
            document.getElementById(
                "unitWidth"
            ).value
        );


    const height =
        parseMeasurement(
            document.getElementById(
                "unitHeight"
            ).value
        );


    const depth =
        parseMeasurement(
            document.getElementById(
                "unitDepth"
            ).value
        );


    const doorCount =
        Number(
            document.getElementById(
                "doorCount"
            ).value
        );


    const unitType =
        document.getElementById(
            "unitType"
        ).value;



    /* بررسی */

    if (
        Number.isNaN(width) ||
        Number.isNaN(height) ||
        Number.isNaN(depth) ||
        width <= 0 ||
        height <= 0 ||
        depth <= 0
    ) {

        alert(
            "لطفاً عرض، ارتفاع و عمق یونیت را درست وارد کنید."
        );

        return;
    }



    /* =================================================
       ارتفاع باکس
    ================================================= */

    const boxHeight =
        height - baseHeight;



    /* =================================================
       ارتفاع بغل
       
       چون کف زیر بغل قرار دارد:
       
       ارتفاع کل
       - پایه
       - ضخامت کف
    ================================================= */

    const sideHeight =
        height -
        baseHeight -
        thickness;



    /* =================================================
       عرض بین دو بغل
    ================================================= */

    const innerWidth =
        width -
        (thickness * 2);



    /* =================================================
       عمق کف

       فعلاً عمق خام همان عمق واردشده است.
       نوارکاری در مرحله تعیین لبه قطعه اعمال می‌شود.
    ================================================= */

    const floorDepth =
        depth;



    /* =================================================
       پاک کردن جدول
    ================================================= */

    const table =
        document.getElementById(
            "partsTable"
        );


    table.innerHTML = "";



    /* =================================================
       بغل‌ها

       فعلاً یک لبه نوار در طول
    ================================================= */

    addPart(
        "بغل یونیت",
        2,
        sideHeight,
        depth,
        "─"
    );



    /* =================================================
       کف

       مثال:
       اگر عمق 58 و نوار 2 میل باشد:

       58 - 0/2 = 57/8

       فرض فعلی:
       یک جهت نوار دارد.
    ================================================= */

    const floorCutDepth =
        edgeSize(
            floorDepth,
            true,
            edgeThickness
        );


    addPart(
        "کف",
        1,
        innerWidth,
        floorCutDepth,
        "═"
    );



    /* =================================================
       قید جلو 7
    ================================================= */

    addPart(
        "قید جلو 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );



    /* =================================================
       قید جلو 5
    ================================================= */

    addPart(
        "قید جلو 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );



    /* =================================================
       قید پشت 7
    ================================================= */

    addPart(
        "قید پشت 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );



    /* =================================================
       قید پشت 5
    ================================================= */

    addPart(
        "قید پشت 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );



    /* =================================================
       پشت

       سر تا سر باکس
    ================================================= */

    addPart(
        "پشت",
        1,
        width,
        boxHeight,
        "بدون نوار"
    );



    /* =================================================
       محاسبه درب
    ================================================= */


    /*
       درب همیشه چهار طرف نوار دارد.

       بادخور فقط یک بار از اندازه
       هر جهت مربوطه کم می‌شود.

       برای یک درب:

       عرض درب =
       عرض یونیت - دو طرف بادخور

       ارتفاع درب =
       ارتفاع باکس - دو طرف بادخور
    */


    let doorWidth;


    let doorHeight =
        boxHeight -
        (doorGap * 2);


    if (doorCount === 1) {


        doorWidth =
            width -
            (doorGap * 2);


    }


    else {


        /*
           برای دو درب:

           فاصله بیرونی چپ
           + فاصله بین دو درب
           + فاصله بیرونی راست

           در مجموع سه بادخور

           بنابراین:
        */

        doorWidth =
            (
                width -
                (doorGap * 3)
            ) / 2;

    }



    /*
       چون چهار طرف درب نوار می‌خورد،
       اندازه برش هر جهت یک بار
       به اندازه ضخامت نوار اصلاح می‌شود.
    */

    const doorCutWidth =
        edgeSize(
            doorWidth,
            true,
            edgeThickness
        );


    const doorCutHeight =
        edgeSize(
            doorHeight,
            true,
            edgeThickness
        );



    addPart(
        "درب",
        doorCount,
        doorCutWidth,
        doorCutHeight,
        "═ ═"
    );



    /* =================================================
       نمایش خلاصه
    ================================================= */

    document.getElementById(
        "resultSection"
    ).style.display =
        "block";


    document.getElementById(
        "partsSection"
    ).style.display =
        "block";


    document.getElementById(
        "summary"
    ).innerHTML = `

        <p>
            <strong>
                نوع یونیت:
            </strong>

            ${getUnitName(unitType)}
        </p>


        <p>
            <strong>
                ابعاد کلی:
            </strong>

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع پایه:
            </strong>

            ${formatMeasurement(baseHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع باکس:
            </strong>

            ${formatMeasurement(boxHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع بغل:
            </strong>

            ${formatMeasurement(sideHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت ورق:
            </strong>

            ${formatMeasurement(thickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت نوار:
            </strong>

            ${formatMeasurement(edgeThickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                بادخور:
            </strong>

            ${formatMeasurement(doorGap)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                تعداد درب:
            </strong>

            ${doorCount}
        </p>

    `;
}



/* =================================================
   نام یونیت
================================================= */

function getUnitName(type) {

    const names = {

        base:
            "یونیت زمینی",

        wall:
            "یونیت دیواری",

        tall:
            "یونیت ایستاده",

        sink:
            "یونیت سینک",

        drawer:
            "یونیت کشویی"

    };


    return names[type] || "---";
}



/* =================================================
   اضافه کردن قطعه
================================================= */

function addPart(
    name,
    quantity,
    length,
    width,
    edge
) {


    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>
            ${name}
        </td>

        <td>
            ${quantity}
        </td>

        <td>
            ${formatMeasurement(length)}
        </td>

        <td>
            ${formatMeasurement(width)}
        </td>

        <td>
            ${edge}
        </td>

    `;


    table.appendChild(row);

}

</script>

</body>

</html>
