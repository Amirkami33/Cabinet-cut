<!DOCTYPE html>

    </style>

</head>

<script>


/* =====================================================
   تبدیل اندازه
===================================================== */

function parseMeasurement(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return NaN;

    }


    let text =
        String(value).trim();


    const persian =
        "۰۱۲۳۴۵۶۷۸۹";

    const arabic =
        "٠١٢٣٤٥٦٧٨٩";


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        text =
            text.replaceAll(
                persian[i],
                String(i)
            );

        text =
            text.replaceAll(
                arabic[i],
                String(i)
            );

    }


    text =
        text
        .replaceAll(",", ".")
        .replaceAll("/", ".");


    return Number(text);

}


/* =====================================================
   نمایش اندازه
===================================================== */

function formatMeasurement(number) {

    if (
        number === undefined ||
        number === null ||
        Number.isNaN(number)
    ) {

        return "---";

    }


    return Number(
        number.toFixed(2)
    )
    .toString()
    .replace(".", "/");

}


/* =====================================================
   محاسبه نوار
===================================================== */

function edgeSize(
    size,
    hasEdge,
    edgeThickness
) {

    if (!hasEdge) {

        return size;

    }


    return size - edgeThickness;

}


/* =====================================================
   نام یونیت
===================================================== */

function getUnitName(type) {

    const names = {

        base: "یونیت زمینی",

        wall: "یونیت دیواری",

        tall: "یونیت ایستاده",

        sink: "یونیت سینک",

        drawer: "یونیت کشویی"

    };


    return names[type] || "یونیت کابینت";

}


/* =====================================================
   اضافه کردن قطعه
===================================================== */

function addPart(
    name,
    quantity,
    length,
    width,
    edge
) {

    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement("tr");


    row.innerHTML = `

        <td>${name}</td>

        <td>${quantity}</td>

        <td>
            ${formatMeasurement(length)}
        </td>

        <td>
            ${formatMeasurement(width)}
        </td>

        <td>${edge}</td>

    `;


    table.appendChild(row);

}


/* =====================================================
   محاسبه اصلی
===================================================== */

function calculateUnit() {

    try {

        const thickness =
            Number(
                document.getElementById(
                    "boardThickness"
                ).value
            );


        const edgeThickness =
            Number(
                document.getElementById(
                    "edgeThickness"
                ).value
            );


        const doorGap =
            Number(
                document.getElementById(
                    "doorGap"
                ).value
            );


        const baseHeight =
            Number(
                document.getElementById(
                    "baseHeight"
                ).value
            );


        const width =
            parseMeasurement(
                document.getElementById(
                    "unitWidth"
                ).value
            );


        const height =
            parseMeasurement(
                document.getElementById(
                    "unitHeight"
                ).value
            );


        const depth =
            parseMeasurement(
                document.getElementById(
                    "unitDepth"
                ).value
            );


        const doorCount =
            Number(
                document.getElementById(
                    "doorCount"
                ).value
            );


        const unitType =
            document.getElementById(
                "unitType"
            ).value;


        /* بررسی */

        if (
            !Number.isFinite(width) ||
            !Number.isFinite(height) ||
            !Number.isFinite(depth) ||
            width <= 0 ||
            height <= 0 ||
            depth <= 0
        ) {

            alert(
                "لطفاً عرض، ارتفاع و عمق یونیت را درست وارد کنید."
            );

            return;

        }


        /* ارتفاع باکس */

        const boxHeight =
            height - baseHeight;


        /* ارتفاع بغل */

        const sideHeight =
            height -
            baseHeight -
            thickness;


        /* عرض داخلی */

        const innerWidth =
            width -
            thickness * 2;


        /* پاک کردن قطعات */

        document.getElementById(
            "partsTable"
        ).innerHTML = "";


        /* بغل */

        addPart(
            "بغل یونیت",
            2,
            sideHeight,
            depth,
            "─"
        );


        /* کف */

        addPart(
            "کف",
            1,
            innerWidth,
            edgeSize(
                depth,
                true,
                edgeThickness
            ),
            "═"
        );


        /* قیدها */

        addPart(
            "قید جلو 7 سانتی",
            1,
            innerWidth,
            7,
            "بدون نوار"
        );


        addPart(
            "قید جلو 5 سانتی",
            1,
            innerWidth,
            5,
            "بدون نوار"
        );


        addPart(
            "قید پشت 7 سانتی",
            1,
            innerWidth,
            7,
            "بدون نوار"
        );


        addPart(
            "قید پشت 5 سانتی",
            1,
            innerWidth,
            5,
            "بدون نوار"
        );


        /* پشت */

        addPart(
            "پشت",
            1,
            width,
            boxHeight,
            "بدون نوار"
        );


        /* درب */

        const doorHeight =
            boxHeight -
            doorGap * 2;


        let doorWidth;


        if (doorCount === 1) {

            doorWidth =
                width -
                doorGap * 2;

        } else {

            doorWidth =
                (
                    width -
                    doorGap * 3
                ) / 2;

        }


        addPart(
            "درب",
            doorCount,
            edgeSize(
                doorWidth,
                true,
                edgeThickness
            ),
            edgeSize(
                doorHeight,
                true,
                edgeThickness
            ),
            "═ ═"
        );


        /* نمایش بخش‌ها */

        document.getElementById(
            "resultSection"
        ).style.display = "block";


        document.getElementById(
            "partsSection"
        ).style.display = "block";


        document.getElementById(
            "unitViewSection"
        ).style.display = "block";


        /* خلاصه */

        document.getElementById(
            "summary"
        ).innerHTML = `

            <p>
                <strong>نوع یونیت:</strong>
                ${getUnitName(unitType)}
            </p>

            <p>
                <strong>ابعاد کلی:</strong>
                ${formatMeasurement(width)}
                ×
                ${formatMeasurement(height)}
                ×
                ${formatMeasurement(depth)}
                سانت
            </p>

            <p>
                <strong>ارتفاع پایه:</strong>
                ${formatMeasurement(baseHeight)}
                سانت
            </p>

            <p>
                <strong>ارتفاع باکس:</strong>
                ${formatMeasurement(boxHeight)}
                سانت
            </p>

            <p>
                <strong>ارتفاع بغل:</strong>
                ${formatMeasurement(sideHeight)}
                سانت
            </p>

            <p>
                <strong>ضخامت ورق:</strong>
                ${formatMeasurement(thickness)}
                سانت
            </p>

            <p>
                <strong>ضخامت نوار:</strong>
                ${formatMeasurement(edgeThickness)}
                سانت
            </p>

            <p>
                <strong>بادخور درب:</strong>
                ${formatMeasurement(doorGap)}
                سانت
            </p>

            <p>
                <strong>تعداد درب:</strong>
                ${doorCount}
            </p>

        `;


        /* رسم */

        drawUnit(
            width,
            height,
            depth,
            baseHeight,
            thickness,
            doorCount,
            doorGap,
            unitType
        );


        /* رفتن به بخش نمایش */

        setTimeout(function () {

            document
                .getElementById(
                    "unitViewSection"
                )
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

        }, 100);


    }

    catch (error) {

        console.error(error);

        alert(
            "در محاسبه یونیت خطایی رخ داد. صفحه را دوباره باز کنید."
        );

    }

}


/* =====================================================
   رسم یونیت
===================================================== */

function drawUnit(
    width,
    height,
    depth,
    baseHeight,
    thickness,
    doorCount,
    doorGap,
    unitType
) {

    const drawing =
        document.getElementById(
            "unitDrawing"
        );


    const info =
        document.getElementById(
            "drawingInfo"
        );


    /* اندازه SVG */

    const svgWidth = 620;

    const svgHeight = 470;


    /* موقعیت */

    const x = 110;

    const y = 55;


    const bodyWidth = 400;

    const totalPixelHeight = 300;


    /* نسبت پایه */

    let baseRatio =
        baseHeight / height;


    if (baseRatio > 0.45) {

        baseRatio = 0.45;

    }


    const basePixelHeight =
        Math.max(
            35,
            totalPixelHeight *
            baseRatio
        );


    const bodyPixelHeight =
        totalPixelHeight -
        basePixelHeight;


    const sidePixelWidth = 22;


    const floorY =
        y +
        bodyPixelHeight;


    /* شروع SVG */

    let svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${svgWidth}"
            height="${svgHeight}"
            viewBox="0 0 ${svgWidth} ${svgHeight}"
        >

            <!-- عنوان -->

            <text
                x="310"
                y="28"
                text-anchor="middle"
                font-size="19"
                font-weight="bold"
                fill="#0f2a4a"
            >
                ${getUnitName(unitType)}
            </text>


            <!-- بدنه -->

            <rect
                x="${x}"
                y="${y}"
                width="${bodyWidth}"
                height="${bodyPixelHeight}"
                fill="#e2e8f0"
                stroke="#0f2a4a"
                stroke-width="3"
                rx="5"
            />


            <!-- بغل چپ -->

            <rect
                x="${x}"
                y="${y}"
                width="${sidePixelWidth}"
                height="${bodyPixelHeight}"
                fill="#cbd5e1"
                stroke="#0f2a4a"
                stroke-width="2"
            />


            <!-- بغل راست -->

            <rect
                x="${x + bodyWidth - sidePixelWidth}"
                y="${y}"
                width="${sidePixelWidth}"
                height="${bodyPixelHeight}"
                fill="#cbd5e1"
                stroke="#0f2a4a"
                stroke-width="2"
            />


            <!-- قید جلو -->

            <rect
                x="${x + sidePixelWidth}"
                y="${y + 12}"
                width="${bodyWidth - sidePixelWidth * 2}"
                height="20"
                fill="#94a3b8"
                stroke="#0f2a4a"
                stroke-width="2"
            />


            <!-- قید دوم -->

            <rect
                x="${x + sidePixelWidth}"
                y="${y + 38}"
                width="${bodyWidth - sidePixelWidth * 2}"
                height="14"
                fill="#cbd5e1"
                stroke="#0f2a4a"
                stroke-width="2"
            />

    `;


    /* فضای درب */

    const doorX =
        x +
        sidePixelWidth +
        4;


    const doorWidth =
        bodyWidth -
        sidePixelWidth * 2 -
        8;


    const doorY =
        y + 58;


    const doorHeight =
        Math.max(
            40,
            bodyPixelHeight - 66
        );


    if (doorCount === 1) {

        svg += `

            <rect
                x="${doorX}"
                y="${doorY}"
                width="${doorWidth}"
                height="${doorHeight}"
                fill="#ffffff"
                stroke="#0f2a4a"
                stroke-width="2"
                rx="4"
            />

            <circle
                cx="${doorX + doorWidth - 15}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#64748b"
            />

        `;

    } else {

        const gap = 5;

        const singleWidth =
            (
                doorWidth -
                gap
            ) / 2;


        svg += `

            <rect
                x="${doorX}"
                y="${doorY}"
                width="${singleWidth}"
                height="${doorHeight}"
                fill="#ffffff"
                stroke="#0f2a4a"
                stroke-width="2"
                rx="4"
            />

            <rect
                x="${doorX + singleWidth + gap}"
                y="${doorY}"
                width="${singleWidth}"
                height="${doorHeight}"
                fill="#ffffff"
                stroke="#0f2a4a"
                stroke-width="2"
                rx="4"
            />

            <circle
                cx="${doorX + singleWidth - 14}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#64748b"
            />

            <circle
                cx="${doorX + singleWidth + gap + 14}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#64748b"
            />

        `;

    }


    /* کف */

    svg += `

        <rect
            x="${x + sidePixelWidth}"
            y="${floorY - 10}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="10"
            fill="#94a3b8"
            stroke="#0f2a4a"
            stroke-width="2"
        />


        <!-- پایه چپ -->

        <rect
            x="${x + 35}"
            y="${floorY}"
            width="55"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f2a4a"
            stroke-width="2"
            rx="4"
        />


        <!-- پایه راست -->

        <rect
            x="${x + bodyWidth - 90}"
            y="${floorY}"
            width="55"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f2a4a"
            stroke-width="2"
            rx="4"
        />


        <!-- خط عرض -->

        <line
            x1="${x}"
            y1="${floorY + basePixelHeight + 28}"
            x2="${x + bodyWidth}"
            y2="${floorY + basePixelHeight + 28}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x}"
            y1="${floorY + basePixelHeight + 20}"
            x2="${x}"
            y2="${floorY + basePixelHeight + 36}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x + bodyWidth}"
            y1="${floorY + basePixelHeight + 20}"
            x2="${x + bodyWidth}"
            y2="${floorY + basePixelHeight + 36}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x + bodyWidth / 2}"
            y="${floorY + basePixelHeight + 50}"
            text-anchor="middle"
            font-size="15"
            font-weight="bold"
            fill="#334155"
        >
            عرض:
            ${formatMeasurement(width)}
            سانت
        </text>


        <!-- خط ارتفاع -->

        <line
            x1="${x - 35}"
            y1="${y}"
            x2="${x - 35}"
            y2="${floorY + basePixelHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x - 43}"
            y1="${y}"
            x2="${x - 27}"
            y2="${y}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x - 43}"
            y1="${floorY + basePixelHeight}"
            x2="${x - 27}"
            y2="${floorY + basePixelHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x - 48}"
            y="${y + 150}"
            text-anchor="middle"
            font-size="14"
            font-weight="bold"
            fill="#334155"
            transform="rotate(-90 ${x - 48} ${y + 150})"
        >
            ارتفاع:
            ${formatMeasurement(height)}
            سانت
        </text>


        <!-- پایه -->

        <text
            x="${x + bodyWidth + 20}"
            y="${floorY + basePixelHeight / 2}"
            font-size="13"
            fill="#334155"
        >
            پایه:
            ${formatMeasurement(baseHeight)}
        </text>

    `;


    /* پایان SVG */

    svg += `

        </svg>

    `;


    /* قرار دادن شکل */

    drawing.innerHTML = svg;


    /* اطلاعات زیر شکل */

    info.innerHTML = `

        <strong>
            ${getUnitName(unitType)}
        </strong>

        <br>

        عرض:
        ${formatMeasurement(width)}
        سانت

        |

        ارتفاع:
        ${formatMeasurement(height)}
        سانت

        |

        عمق:
        ${formatMeasurement(depth)}
        سانت

        <br>

        تعداد درب:
        ${doorCount}

        |

        پایه:
        ${formatMeasurement(baseHeight)}
        سانت

    `;

}

</script>


</body>

</html>
