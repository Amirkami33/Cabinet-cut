<script>


/* =================================================
   تبدیل اعداد فارسی و /
================================================= */

function parseMeasurement(value) {

    if (!value) {
        return NaN;
    }


    value =
        value
        .toString()
        .trim();


    const persian =
        ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];

    const arabic =
        ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];


    for (let i = 0; i < 10; i++) {

        value =
            value.replaceAll(
                persian[i],
                i
            );

        value =
            value.replaceAll(
                arabic[i],
                i
            );

    }


    value =
        value
        .replaceAll(",", ".")
        .replaceAll("/", ".");


    return Number(value);

}



/* =================================================
   نمایش اندازه
================================================= */

function formatMeasurement(number) {

    if (
        number === undefined ||
        number === null ||
        Number.isNaN(number)
    ) {
        return "---";
    }


    const result =
        Number(
            number.toFixed(2)
        );


    return result
        .toString()
        .replace(".", "/");

}



/* =================================================
   محاسبه اندازه با نوار
================================================= */

function edgeSize(
    size,
    hasEdge,
    edgeThickness
) {

    if (!hasEdge) {
        return size;
    }


    return size - edgeThickness;

}



/* =================================================
   محاسبه یونیت
================================================= */

function calculateUnit() {


    /* تنظیمات */

    const thickness =
        Number(
            document.getElementById(
                "boardThickness"
            ).value
        );


    const edgeThickness =
        Number(
            document.getElementById(
                "edgeThickness"
            ).value
        );


    const doorGap =
        Number(
            document.getElementById(
                "doorGap"
            ).value
        );


    const baseHeight =
        Number(
            document.getElementById(
                "baseHeight"
            ).value
        );


    const backThickness =
        Number(
            document.getElementById(
                "backType"
            ).value
        );


    /* ابعاد */

    const width =
        parseMeasurement(
            document.getElementById(
                "unitWidth"
            ).value
        );


    const height =
        parseMeasurement(
            document.getElementById(
                "unitHeight"
            ).value
        );


    const depth =
        parseMeasurement(
            document.getElementById(
                "unitDepth"
            ).value
        );


    const doorCount =
        Number(
            document.getElementById(
                "doorCount"
            ).value
        );


    const unitType =
        document.getElementById(
            "unitType"
        ).value;



    /* بررسی اطلاعات */

    if (
        Number.isNaN(width) ||
        Number.isNaN(height) ||
        Number.isNaN(depth) ||
        width <= 0 ||
        height <= 0 ||
        depth <= 0
    ) {

        alert(
            "لطفاً عرض، ارتفاع و عمق یونیت را درست وارد کنید."
        );

        return;

    }



    /* ارتفاع باکس */

    const boxHeight =
        height - baseHeight;



    /* ارتفاع بغل */

    const sideHeight =
        height -
        baseHeight -
        thickness;



    /* عرض داخلی */

    const innerWidth =
        width -
        (thickness * 2);



    /* عمق کف */

    const floorDepth =
        depth;



    /* پاک کردن جدول */

    const table =
        document.getElementById(
            "partsTable"
        );


    table.innerHTML = "";



    /* =========================
       بغل
    ========================= */

    addPart(
        "بغل یونیت",
        2,
        sideHeight,
        depth,
        "─"
    );



    /* =========================
       کف
    ========================= */

    const floorCutDepth =
        edgeSize(
            floorDepth,
            true,
            edgeThickness
        );


    addPart(
        "کف",
        1,
        innerWidth,
        floorCutDepth,
        "═"
    );



    /* =========================
       قیدها
    ========================= */

    addPart(
        "قید جلو 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );


    addPart(
        "قید جلو 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );


    addPart(
        "قید پشت 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );


    addPart(
        "قید پشت 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );



    /* =========================
       پشت
       
       عرض و ارتفاع باکس
       بدون کاهش در عمق
    ========================= */

    addPart(
        "پشت",
        1,
        width,
        boxHeight,
        "بدون نوار"
    );



    /* =========================
       درب
    ========================= */

    let doorWidth;


    const doorHeight =
        boxHeight -
        (doorGap * 2);


    if (doorCount === 1) {

        doorWidth =
            width -
            (doorGap * 2);

    }

    else {

        doorWidth =
            (
                width -
                (doorGap * 3)
            ) / 2;

    }


    const doorCutWidth =
        edgeSize(
            doorWidth,
            true,
            edgeThickness
        );


    const doorCutHeight =
        edgeSize(
            doorHeight,
            true,
            edgeThickness
        );


    addPart(
        "درب",
        doorCount,
        doorCutWidth,
        doorCutHeight,
        "═ ═"
    );



    /* =========================
       نمایش خلاصه
    ========================= */

    document.getElementById(
        "resultSection"
    ).style.display =
        "block";


    document.getElementById(
        "partsSection"
    ).style.display =
        "block";


    document.getElementById(
        "unitViewSection"
    ).style.display =
        "block";


    document.getElementById(
        "summary"
    ).innerHTML = `

        <p>
            <strong>
                نوع یونیت:
            </strong>

            ${getUnitName(unitType)}
        </p>


        <p>
            <strong>
                ابعاد کلی:
            </strong>

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع پایه:
            </strong>

            ${formatMeasurement(baseHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع باکس:
            </strong>

            ${formatMeasurement(boxHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع بغل:
            </strong>

            ${formatMeasurement(sideHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت ورق:
            </strong>

            ${formatMeasurement(thickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت نوار:
            </strong>

            ${formatMeasurement(edgeThickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                بادخور:
            </strong>

            ${formatMeasurement(doorGap)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                تعداد درب:
            </strong>

            ${doorCount}
        </p>

    `;



    /* =========================
       رسم شکل
    ========================= */

    drawUnit(
        width,
        height,
        depth,
        baseHeight,
        thickness,
        doorCount,
        doorGap,
        unitType
    );

}



/* =================================================
   نام یونیت
================================================= */

function getUnitName(type) {

    const names = {

        base:
            "یونیت زمینی",

        wall:
            "یونیت دیواری",

        tall:
            "یونیت ایستاده",

        sink:
            "یونیت سینک",

        drawer:
            "یونیت کشویی"

    };


    return names[type] || "---";

}



/* =================================================
   اضافه کردن قطعه
================================================= */

function addPart(
    name,
    quantity,
    length,
    width,
    edge
) {


    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>
            ${name}
        </td>

        <td>
            ${quantity}
        </td>

        <td>
            ${formatMeasurement(length)}
        </td>

        <td>
            ${formatMeasurement(width)}
        </td>

        <td>
            ${edge}
        </td>

    `;


    table.appendChild(row);

}



/* =================================================
   رسم نمای یونیت
================================================= */

function drawUnit(
    width,
    height,
    depth,
    baseHeight,
    thickness,
    doorCount,
    doorGap,
    unitType
) {


    const drawing =
        document.getElementById(
            "unitDrawing"
        );


    const info =
        document.getElementById(
            "drawingInfo"
        );



    /*
       اندازه SVG
    */

    const svgWidth = 620;

    const svgHeight = 470;



    /*
       مختصات اصلی

       بدنه از X=100 شروع می‌شود.
    */

    const x = 110;

    const y = 55;

    const bodyWidth = 400;

    const bodyHeight = 300;



    /*
       نسبت ارتفاع پایه
    */

    const baseRatio =
        baseHeight / height;


    const basePixelHeight =
        Math.max(
            30,
            bodyHeight * baseRatio
        );



    const bodyPixelHeight =
        bodyHeight -
        basePixelHeight;



    /*
       عرض بغل
    */

    const sidePixelWidth =
        20;



    /*
       ارتفاع کف
    */

    const floorY =
        y +
        bodyPixelHeight;



    /*
       درب
    */

    const frontDoorHeight =
        bodyPixelHeight;



    /*
       ایجاد SVG
    */

    let svg = `

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${svgWidth}"
        height="${svgHeight}"
        viewBox="0 0 ${svgWidth} ${svgHeight}"
        style="
            max-width:100%;
            height:auto;
            font-family:Tahoma,Arial,sans-serif;
        "
    >



        <!-- عنوان -->

        <text
            x="310"
            y="28"
            text-anchor="middle"
            font-size="18"
            font-weight="bold"
            fill="#1e293b">

            ${getUnitName(unitType)}

        </text>



        <!-- بدنه اصلی -->

        <rect
            x="${x}"
            y="${y}"
            width="${bodyWidth}"
            height="${bodyPixelHeight}"
            fill="#e2e8f0"
            stroke="#0f172a"
            stroke-width="3"
            rx="3"
        />



        <!-- بغل چپ -->

        <rect
            x="${x}"
            y="${y}"
            width="${sidePixelWidth}"
            height="${bodyPixelHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- بغل راست -->

        <rect
            x="${x + bodyWidth - sidePixelWidth}"
            y="${y}"
            width="${sidePixelWidth}"
            height="${bodyPixelHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- کف -->

        <rect
            x="${x + sidePixelWidth}"
            y="${floorY - 10}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="10"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- قید جلو 7 -->

        <rect
            x="${x + sidePixelWidth}"
            y="${y + 12}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="18"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- قید جلو 5 -->

        <rect
            x="${x + sidePixelWidth}"
            y="${y + 35}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="14"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- درب‌ها -->

    `;



    /*
       فضای درب
    */

    const doorAreaX =
        x + sidePixelWidth + 3;


    const doorAreaWidth =
        bodyWidth -
        sidePixelWidth * 2 -
        6;


    const doorY =
        y + 52;


    const doorAreaHeight =
        bodyPixelHeight -
        60;



    if (doorCount === 1) {


        svg += `

            <rect
                x="${doorAreaX}"
                y="${doorY}"
                width="${doorAreaWidth}"
                height="${doorAreaHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="2"
            />

        `;


    }


    else {


        const gapPixel = 4;

        const singleDoorWidth =
            (
                doorAreaWidth -
                gapPixel
            ) / 2;


        svg += `

            <rect
                x="${doorAreaX}"
                y="${doorY}"
                width="${singleDoorWidth}"
                height="${doorAreaHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="2"
            />


            <rect
                x="${doorAreaX + singleDoorWidth + gapPixel}"
                y="${doorY}"
                width="${singleDoorWidth}"
                height="${doorAreaHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="2"
            />

        `;

    }



    /*
       پایه‌ها
    */

    const legWidth = 55;

    const legY =
        floorY;


    svg += `

        <!-- پایه چپ -->

        <rect
            x="${x + 30}"
            y="${legY}"
            width="${legWidth}"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
            rx="3"
        />


        <!-- پایه راست -->

        <rect
            x="${x + bodyWidth - 30 - legWidth}"
            y="${legY}"
            width="${legWidth}"
            height="${basePixelHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
            rx="3"
        />



        <!-- خط اندازه عرض -->

        <line
            x1="${x}"
            y1="${legY + basePixelHeight + 30}"
            x2="${x + bodyWidth}"
            y2="${legY + basePixelHeight + 30}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x}"
            y1="${legY + basePixelHeight + 22}"
            x2="${x}"
            y2="${legY + basePixelHeight + 38}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x + bodyWidth}"
            y1="${legY + basePixelHeight + 22}"
            x2="${x + bodyWidth}"
            y2="${legY + basePixelHeight + 38}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x + bodyWidth / 2}"
            y="${legY + basePixelHeight + 52}"
            text-anchor="middle"
            font-size="15"
            fill="#334155">

            عرض:
            ${formatMeasurement(width)}
            سانت

        </text>



        <!-- خط اندازه ارتفاع -->

        <line
            x1="${x - 35}"
            y1="${y}"
            x2="${x - 35}"
            y2="${legY + basePixelHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x - 45}"
            y="${y + bodyHeight / 2}"
            text-anchor="middle"
            font-size="15"
            fill="#334155"
            transform="rotate(-90 ${x - 45} ${y + bodyHeight / 2})">

            ارتفاع:
            ${formatMeasurement(height)}
            سانت

        </text>



        <!-- ارتفاع پایه -->

        <text
            x="${x + bodyWidth + 25}"
            y="${legY + basePixelHeight / 2}"
            font-size="13"
            fill="#334155">

            پایه:
            ${formatMeasurement(baseHeight)}

        </text>

    `;



    svg += `

    </svg>

    `;



    drawing.innerHTML =
        svg;



    info.innerHTML = `

        <strong>
            ${getUnitName(unitType)}
        </strong>

        <br>

        عرض:
        ${formatMeasurement(width)}
        سانت

        |

        ارتفاع:
        ${formatMeasurement(height)}
        سانت

        |

        عمق:
        ${formatMeasurement(depth)}
        سانت

        <br>

        تعداد درب:
        ${doorCount}

        |

        پایه:
