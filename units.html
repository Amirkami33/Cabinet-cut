<script>


/* =================================================
   تبدیل اعداد فارسی و عربی
================================================= */

function parseMeasurement(value) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return NaN;
    }


    value =
        value
        .toString()
        .trim();


    const persian =
        [
            "۰","۱","۲","۳","۴",
            "۵","۶","۷","۸","۹"
        ];


    const arabic =
        [
            "٠","١","٢","٣","٤",
            "٥","٦","٧","٨","٩"
        ];


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        value =
            value.replaceAll(
                persian[i],
                i
            );


        value =
            value.replaceAll(
                arabic[i],
                i
            );

    }


    value =
        value
        .replaceAll(",", ".")
        .replaceAll("/", ".");


    return Number(value);

}



/* =================================================
   نمایش اندازه
================================================= */

function formatMeasurement(number) {

    if (
        number === undefined ||
        number === null ||
        Number.isNaN(number)
    ) {

        return "---";

    }


    const result =
        Number(
            Number(number).toFixed(2)
        );


    return result
        .toString()
        .replace(".", "/");

}



/* =================================================
   کاهش اندازه بابت نوار
================================================= */

function edgeSize(
    size,
    hasEdge,
    edgeThickness
) {

    if (!hasEdge) {

        return size;

    }


    return size - edgeThickness;

}



/* =================================================
   نام یونیت
================================================= */

function getUnitName(type) {

    const names = {

        base:
            "یونیت زمینی",

        wall:
            "یونیت دیواری",

        tall:
            "یونیت ایستاده",

        sink:
            "یونیت سینک",

        drawer:
            "یونیت کشویی"

    };


    return names[type] || "یونیت";

}



/* =================================================
   محاسبه یونیت
================================================= */

function calculateUnit() {


    /* =========================
       دریافت تنظیمات
    ========================= */

    const thickness =
        Number(
            document.getElementById(
                "boardThickness"
            ).value
        );


    const edgeThickness =
        Number(
            document.getElementById(
                "edgeThickness"
            ).value
        );


    const doorGap =
        Number(
            document.getElementById(
                "doorGap"
            ).value
        );


    const baseHeight =
        Number(
            document.getElementById(
                "baseHeight"
            ).value
        );


    const backThickness =
        Number(
            document.getElementById(
                "backType"
            ).value
        );


    /* =========================
       دریافت ابعاد
    ========================= */

    const width =
        parseMeasurement(
            document.getElementById(
                "unitWidth"
            ).value
        );


    const height =
        parseMeasurement(
            document.getElementById(
                "unitHeight"
            ).value
        );


    const depth =
        parseMeasurement(
            document.getElementById(
                "unitDepth"
            ).value
        );


    const doorCount =
        Number(
            document.getElementById(
                "doorCount"
            ).value
        );


    const unitType =
        document.getElementById(
            "unitType"
        ).value;



    /* جلوگیری از خطای ورودی */

    if (
        !Number.isFinite(width) ||
        !Number.isFinite(height) ||
        !Number.isFinite(depth) ||
        width <= 0 ||
        height <= 0 ||
        depth <= 0
    ) {

        alert(
            "لطفاً عرض، ارتفاع و عمق یونیت را درست وارد کنید."
        );

        return;

    }



    /* =========================
       محاسبات اصلی
    ========================= */

    const boxHeight =
        height -
        baseHeight;


    const sideHeight =
        height -
        baseHeight -
        thickness;


    const innerWidth =
        width -
        (thickness * 2);


    const floorDepth =
        depth;



    /* بررسی منطقی */

    if (
        boxHeight <= 0 ||
        sideHeight <= 0 ||
        innerWidth <= 0
    ) {

        alert(
            "ابعاد وارد شده برای ساخت این یونیت مناسب نیست."
        );

        return;

    }



    /* =========================
       پاک کردن جدول
    ========================= */

    const table =
        document.getElementById(
            "partsTable"
        );


    table.innerHTML = "";



    /* =========================
       بغل
    ========================= */

    addPart(
        "بغل یونیت",
        2,
        sideHeight,
        depth,
        "─"
    );



    /* =========================
       کف
    ========================= */

    const floorCutDepth =
        edgeSize(
            floorDepth,
            true,
            edgeThickness
        );


    addPart(
        "کف",
        1,
        innerWidth,
        floorCutDepth,
        "═"
    );



    /* =========================
       قیدها
    ========================= */

    addPart(
        "قید جلو 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );


    addPart(
        "قید جلو 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );


    addPart(
        "قید پشت 7 سانتی",
        1,
        innerWidth,
        7,
        "بدون نوار"
    );


    addPart(
        "قید پشت 5 سانتی",
        1,
        innerWidth,
        5,
        "بدون نوار"
    );



    /* =========================
       پشت
    ========================= */

    addPart(
        "پشت",
        1,
        width,
        boxHeight,
        "بدون نوار"
    );



    /* =========================
       درب
    ========================= */

    const doorHeight =
        boxHeight -
        (doorGap * 2);


    let doorWidth;


    if (doorCount === 1) {

        doorWidth =
            width -
            (doorGap * 2);

    }

    else {

        doorWidth =
            (
                width -
                (doorGap * 3)
            ) / 2;

    }


    const doorCutWidth =
        edgeSize(
            doorWidth,
            true,
            edgeThickness
        );


    const doorCutHeight =
        edgeSize(
            doorHeight,
            true,
            edgeThickness
        );


    addPart(
        "درب",
        doorCount,
        doorCutWidth,
        doorCutHeight,
        "═ ═"
    );



    /* =========================
       نمایش بخش‌ها
    ========================= */

    document.getElementById(
        "resultSection"
    ).style.display =
        "block";


    document.getElementById(
        "partsSection"
    ).style.display =
        "block";


    document.getElementById(
        "unitViewSection"
    ).style.display =
        "block";



    /* =========================
       خلاصه
    ========================= */

    document.getElementById(
        "summary"
    ).innerHTML = `

        <p>
            <strong>
                نوع یونیت:
            </strong>

            ${getUnitName(unitType)}
        </p>


        <p>
            <strong>
                ابعاد کلی:
            </strong>

            ${formatMeasurement(width)}
            ×
            ${formatMeasurement(height)}
            ×
            ${formatMeasurement(depth)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع پایه:
            </strong>

            ${formatMeasurement(baseHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع باکس:
            </strong>

            ${formatMeasurement(boxHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ارتفاع بغل:
            </strong>

            ${formatMeasurement(sideHeight)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت ورق:
            </strong>

            ${formatMeasurement(thickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                ضخامت نوار:
            </strong>

            ${formatMeasurement(edgeThickness)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                بادخور:
            </strong>

            ${formatMeasurement(doorGap)}
            سانتی‌متر
        </p>


        <p>
            <strong>
                تعداد درب:
            </strong>

            ${doorCount}
        </p>

    `;



    /* =========================
       رسم یونیت
    ========================= */

    drawUnit(
        width,
        height,
        depth,
        baseHeight,
        thickness,
        doorCount,
        doorGap,
        unitType
    );

}



/* =================================================
   اضافه کردن قطعه به جدول
================================================= */

function addPart(
    name,
    quantity,
    length,
    width,
    edge
) {


    const table =
        document.getElementById(
            "partsTable"
        );


    const row =
        document.createElement(
            "tr"
        );


    row.innerHTML = `

        <td>
            ${name}
        </td>

        <td>
            ${quantity}
        </td>

        <td>
            ${formatMeasurement(length)}
        </td>

        <td>
            ${formatMeasurement(width)}
        </td>

        <td>
            ${edge}
        </td>

    `;


    table.appendChild(row);

}



/* =================================================
   رسم نمای یونیت
================================================= */

function drawUnit(
    width,
    height,
    depth,
    baseHeight,
    thickness,
    doorCount,
    doorGap,
    unitType
) {


    const drawing =
        document.getElementById(
            "unitDrawing"
        );


    const info =
        document.getElementById(
            "drawingInfo"
        );


    if (!drawing) {

        console.error(
            "unitDrawing پیدا نشد."
        );

        return;

    }



    /* =========================
       ابعاد SVG
    ========================= */

    const svgWidth = 680;

    const svgHeight = 520;



    /* =========================
       بدنه اصلی
    ========================= */

    const x = 140;

    const y = 70;

    const bodyWidth = 400;

    const totalPixelHeight = 330;



    /* =========================
       نسبت پایه
    ========================= */

    let baseRatio =
        baseHeight / height;


    baseRatio =
        Math.max(
            0.08,
            Math.min(
                baseRatio,
                0.35
            )
        );


    const basePixelHeight =
        totalPixelHeight *
        baseRatio;


    const boxPixelHeight =
        totalPixelHeight -
        basePixelHeight;


    const floorY =
        y +
        boxPixelHeight;



    /* =========================
       ضخامت بغل
    ========================= */

    const sidePixelWidth = 22;



    /* =========================
       فضای درب
    ========================= */

    const doorX =
        x +
        sidePixelWidth +
        4;


    const doorWidth =
        bodyWidth -
        (sidePixelWidth * 2) -
        8;


    const doorY =
        y +
        65;


    const doorHeight =
        boxPixelHeight -
        72;



    /* =========================
       SVG
    ========================= */

    let svg = `

    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${svgWidth}"
        height="${svgHeight}"
        viewBox="0 0 ${svgWidth} ${svgHeight}"
        style="
            max-width:100%;
            height:auto;
            font-family:Tahoma,Arial,sans-serif;
        "
    >


        <!-- عنوان -->

        <text
            x="340"
            y="35"
            text-anchor="middle"
            font-size="21"
            font-weight="bold"
            fill="#0f2a4a"
        >

            ${getUnitName(unitType)}

        </text>



        <!-- بدنه -->

        <rect
            x="${x}"
            y="${y}"
            width="${bodyWidth}"
            height="${boxPixelHeight}"
            fill="#e8edf3"
            stroke="#0f172a"
            stroke-width="3"
            rx="4"
        />



        <!-- بغل چپ -->

        <rect
            x="${x}"
            y="${y}"
            width="${sidePixelWidth}"
            height="${boxPixelHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- بغل راست -->

        <rect
            x="${x + bodyWidth - sidePixelWidth}"
            y="${y}"
            width="${sidePixelWidth}"
            height="${boxPixelHeight}"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- قید جلو 7 -->

        <rect
            x="${x + sidePixelWidth}"
            y="${y + 12}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="18"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- قید جلو 5 -->

        <rect
            x="${x + sidePixelWidth}"
            y="${y + 35}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="14"
            fill="#cbd5e1"
            stroke="#0f172a"
            stroke-width="2"
        />



        <!-- کف -->

        <rect
            x="${x + sidePixelWidth}"
            y="${floorY - 10}"
            width="${bodyWidth - sidePixelWidth * 2}"
            height="10"
            fill="#94a3b8"
            stroke="#0f172a"
            stroke-width="2"
        />

    `;



    /* =========================
       درب‌ها
    ========================= */

    if (doorCount === 1) {

        svg += `

            <rect
                x="${doorX}"
                y="${doorY}"
                width="${doorWidth}"
                height="${doorHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="3"
            />


            <!-- دستگیره -->

            <circle
                cx="${doorX + 18}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#475569"
            />

        `;

    }


    else {

        const gap = 6;

        const singleDoorWidth =
            (
                doorWidth -
                gap
            ) / 2;


        svg += `

            <!-- درب چپ -->

            <rect
                x="${doorX}"
                y="${doorY}"
                width="${singleDoorWidth}"
                height="${doorHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="3"
            />


            <!-- درب راست -->

            <rect
                x="${doorX + singleDoorWidth + gap}"
                y="${doorY}"
                width="${singleDoorWidth}"
                height="${doorHeight}"
                fill="#f8fafc"
                stroke="#0f172a"
                stroke-width="2"
                rx="3"
            />


            <!-- دستگیره چپ -->

            <circle
                cx="${doorX + singleDoorWidth - 18}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#475569"
            />


            <!-- دستگیره راست -->

            <circle
                cx="${doorX + singleDoorWidth + gap + 18}"
                cy="${doorY + doorHeight / 2}"
                r="4"
                fill="#475569"
            />

        `;

    }



    /* =========================
       پایه‌ها
    ========================= */

    const legWidth = 58;


    const legHeight =
        basePixelHeight;


    svg += `

        <!-- پایه چپ -->

        <rect
            x="${x + 35}"
            y="${floorY}"
            width="${legWidth}"
            height="${legHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
            rx="3"
        />


        <!-- پایه راست -->

        <rect
            x="${x + bodyWidth - 35 - legWidth}"
            y="${floorY}"
            width="${legWidth}"
            height="${legHeight}"
            fill="#64748b"
            stroke="#0f172a"
            stroke-width="2"
            rx="3"
        />



        <!-- خط اندازه عرض -->

        <line
            x1="${x}"
            y1="${floorY + legHeight + 35}"
            x2="${x + bodyWidth}"
            y2="${floorY + legHeight + 35}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x}"
            y1="${floorY + legHeight + 27}"
            x2="${x}"
            y2="${floorY + legHeight + 43}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x + bodyWidth}"
            y1="${floorY + legHeight + 27}"
            x2="${x + bodyWidth}"
            y2="${floorY + legHeight + 43}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x + bodyWidth / 2}"
            y="${floorY + legHeight + 65}"
            text-anchor="middle"
            font-size="16"
            font-weight="bold"
            fill="#334155"
        >

            عرض:
            ${formatMeasurement(width)}
            سانت

        </text>



        <!-- خط اندازه ارتفاع -->

        <line
            x1="${x - 45}"
            y1="${y}"
            x2="${x - 45}"
            y2="${floorY + legHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x - 53}"
            y1="${y}"
            x2="${x - 37}"
            y2="${y}"
            stroke="#475569"
            stroke-width="2"
        />


        <line
            x1="${x - 53}"
            y1="${floorY + legHeight}"
            x2="${x - 37}"
            y2="${floorY + legHeight}"
            stroke="#475569"
            stroke-width="2"
        />


        <text
            x="${x - 63}"
            y="${y + totalPixelHeight / 2}"
            text-anchor="middle"
            font-size="16"
            font-weight="bold"
            fill="#334155"
            transform="
                rotate(
                    -90
                    ${x - 63}
                    ${y + totalPixelHeight / 2}
                )
            "
        >

            ارتفاع:
            ${formatMeasurement(height)}
            سانت

        </text>



        <!-- ارتفاع پایه -->

        <text
            x="${x + bodyWidth + 25}"
            y="${floorY + legHeight / 2}"
            font-size="14"
            fill="#334155"
        >

            پایه:
            ${formatMeasurement(baseHeight)}
            سانت

        </text>



        <!-- عمق -->

        <text
            x="${x + bodyWidth}"
            y="${y - 12}"
            text-anchor="end"
            font-size="14"
            fill="#64748b"
        >

            عمق:
            ${formatMeasurement(depth)}
            سانت

        </text>

    `;



    svg += `

    </svg>

    `;



    /* =========================
       قرار دادن SVG
    ========================= */

    drawing.innerHTML =
        svg;



    /* =========================
       اطلاعات پایین شکل
    ========================= */

    info.innerHTML = `

        <strong>
            ${getUnitName(unitType)}
        </strong>

        <br>

        عرض:
        ${formatMeasurement(width)}
        سانت

        &nbsp; | &nbsp;

        ارتفاع:
        ${formatMeasurement(height)}
        سانت

        &nbsp; | &nbsp;

        عمق:
        ${formatMeasurement(depth)}
        سانت

        <br>

        تعداد درب:
        ${doorCount}

        &nbsp; | &nbsp;

        ارتفاع پایه:
        ${formatMeasurement(baseHeight)}
        سانت

    `;

}


</script>


</body>

</html>
